openapi: 3.0.3

# The provisional daemon/client sync surface (docs/plan.md §5.14), spec only:
# no server implementation and no shipped generated code (plan §11 Wave 0).
# Schemas mirror daemon/internal/domain field-for-field; entity examples are
# lifted verbatim from that package's golden files so the linter's
# example-vs-schema validation corroborates the cross-check.

info:
  title: Freeside daemon API
  version: 0.1.0
  x-provisional: true
  description: |
    **Provisional.** This schema is provisional until exercised by real
    clients (plan §11 Wave 0; the decision record lives in
    docs/history/decisions.md, decision 21: "API provisional until
    exercised"). It covers plan §5.14's synchronization surface: the
    canonical bootstrap snapshot, the attention/runs/conversations read
    surfaces, ClientCommand submission, and digest-addressed attachment
    upload. Any change to this document is treated as a migration
    (api/README.md).

    The daemon is sole authority; client databases are disposable read
    caches. Every schema mirrors its `daemon/internal/domain` type
    field-for-field: every field is always present on the wire (the daemon
    marshals without omission), so each object lists all its properties as
    required and marks Go pointer fields nullable. Timestamps are RFC3339
    UTC `date-time` strings; durations are int64 nanoseconds; identifiers
    and digests are opaque non-empty strings.
  contact:
    name: Freeside
    url: https://github.com/freeside-ai/freeside
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /
    description: >
      The daemon serves clients directly; the base URL is
      deployment-specific (device pairing hands the client its daemon
      address), so paths here are relative.

# Every endpoint requires the paired-device credential: revocation must be
# enforceable by contract (a revoked device cannot submit, plan §5.14 sync
# tests 15-16). Exactly two operations override with security: []:
# POST /pairing, which issues the credential (the short-lived pairing code
# is its authenticator), and GET /health, the plan §5.2 liveness probe,
# whose callers (supervisors, probes, an unpaired operator surface) hold
# no credential by design and which discloses nothing beyond liveness,
# version, and start time.
security:
  - deviceCredential: []

tags:
  - name: health
    description: >
      Process liveness for supervisors, probes, and unpaired operator
      surfaces (plan §5.2 supervision contract). Deliberately outside the
      credential boundary and deliberately minimal.
  - name: sync
    description: Cache bootstrap (plan §5.14 revision, epoch, and cache semantics).
  - name: attention
    description: Attention items and their deliveries, read surface (plan §4).
  - name: runs
    description: Run, stage, and attempt state, read surface.
  - name: schedules
    description: >
      Durable scheduler state, read surface (plan §5.16): the synchronized
      schedule aggregates — binding, cadence or deadline, and terminal
      resolution. The daemon-internal tick bookkeeping (timers, occurrence
      ledger) is deliberately not synchronized.
  - name: conversations
    description: Conversations, whole-snapshot per conversation (Phase 1 semantics).
  - name: commands
    description: >
      ClientCommand submission, idempotent by command_id: the single
      mutation surface for judgment-bearing decisions on synchronized
      domain state (plan §5.14). The credential control surface
      (pairing, revocation), digest-addressed attachment upload, and the
      delivery opened receipt (monotonic telemetry, reportDeliveryOpened)
      sit deliberately outside it.
  - name: devices
    description: >
      Device pairing and revocation, the credential control surface (plan
      §5.14 devices): deliberately outside the ClientCommand path, which
      decides attention items under a device credential these operations
      grant and invalidate. Devices are revision-carrying state; the sync
      read surface that carries them to clients (bootstrap widening or a
      device list) lands with its first client consumer, via a later
      contract change.
  - name: attachments
    description: Digest-addressed attachment upload.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Process liveness, version, and start time
      # Unauthenticated by design, with POST /pairing: the callers are
      # supervisors, external liveness probes, and the operator surface
      # deciding whether a daemon is up at all, none of which holds a
      # device credential (plan §5.2).
      security: []
      description: |
        Answers only "is the daemon process up, which build, since when."
        Supervisors and the external liveness probe poll it (plan §5.2);
        the operator client uses `version` for skew detection and
        `started_at` for restart visibility (a start time that keeps
        moving under a supervisor is crash-loop evidence). The response
        deliberately carries no operational state: unattended-admission
        stops, `system_health` items, and everything else requiring
        judgment stay on the authenticated surfaces (plan §4), so this
        route widens what an unpaired caller learns by nothing beyond
        liveness, version, and start time.
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sync/bootstrap:
    get:
      operationId: getSyncBootstrap
      tags: [sync]
      summary: One canonical snapshot of every synchronized resource
      description: |
        Returns one canonical snapshot produced in a single daemon read
        transaction (plan §5.14). The response carries the server's
        `sync_epoch` and `revision`; a client replaces its whole cache with
        this snapshot and records `revision` as its
        `last_full_snapshot_revision`. A partial fetch (any other read
        endpoint) never advances the whole cache: clients track
        `last_full_snapshot_revision` and `highest_observed_server_revision`
        separately, and a revision gap triggers a new bootstrap or a refetch
        of all potentially affected resources. A changed `sync_epoch` (a
        daemon restore) forces cache discard and a fresh bootstrap.
      responses:
        "200":
          description: The canonical snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapSnapshot"

  /sync/revision:
    get:
      operationId: getSyncRevision
      tags: [sync]
      summary: The current server revision and sync epoch
      description: |
        The periodic revision heartbeat that catches lost invalidations
        (plan §5.14; sync test 11): a client polls this cheap read and
        compares `revision` against its
        `highest_observed_server_revision`. A gap means invalidations were
        missed, so the client refetches affected resources or bootstraps;
        it never marks the whole cache current from this response (only a
        bootstrap advances `last_full_snapshot_revision`). A changed
        `sync_epoch` (a daemon restore) forces cache discard and a fresh
        bootstrap.
      responses:
        "200":
          description: The server's current sync epoch and revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerRevision"

  /attention/items:
    get:
      operationId: listAttentionItems
      tags: [attention]
      summary: List attention items
      description: >
        Lists attention items as individual resource snapshots. A partial
        fetch: the result updates only the entities it carries and never
        marks the whole cache current (plan §5.14).
      responses:
        "200":
          description: Attention item snapshots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttentionItemSnapshot"

  /attention/items/{item_id}:
    get:
      operationId: getAttentionItem
      tags: [attention]
      summary: Get one attention item
      description: >
        Returns the item's current canonical state as a resource snapshot.
        A late notification deep-links here and exposes no stale action
        (plan §5.14 sync test 9). The notification's deep link targets
        this operation with channel and attempt query parameters
        identifying the delivery attempt; this GET stays side-effect-free,
        and the client reports the opened receipt separately via
        reportDeliveryOpened.
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          description: The attention item snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttentionItemSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"

  /attention/items/{item_id}/run-proposal:
    get:
      operationId: getRunProposalFacts
      tags: [attention]
      summary: Get authenticated run-proposal facts
      description: >
        Returns the exact digest-bound run-proposal facts rendered by a
        run_proposal item. The daemon reconstructs the private proposal ledger,
        re-resolves the opaque work-unit handle through its durable declaration
        and current policy, and returns only bounded review facts. The version
        tuple lets the client prove the facts and card were read from the same
        item state. Active snoozes remain hidden as 404.
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          description: Authenticated run-proposal facts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunProposalFactsSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"

  /attention/items/{item_id}/deliveries:
    get:
      operationId: listAttentionItemDeliveries
      tags: [attention]
      summary: List an item's delivery attempts
      description: >
        Lists the item's per-channel, per-attempt delivery records (plan
        §4). Delivery rows are created and advanced by the daemon's
        delivery pipeline; the single client write is the opened receipt
        (reportDeliveryOpened), which advances an existing attempt and
        never creates one.
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          description: Delivery snapshots for the item.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttentionDeliverySnapshot"
        "404":
          $ref: "#/components/responses/NotFound"

  /attention/items/{item_id}/deliveries/{channel}/{attempt}/opened:
    put:
      operationId: reportDeliveryOpened
      tags: [attention]
      summary: Report a delivery attempt as opened
      description: |
        Records the authenticated device's opened receipt on one delivery
        attempt: the row advances to `opened` with a daemon-stamped
        `opened_at`, and the item's timing aggregates re-derive in the
        same transaction (plan §4). The receipt carries no request body:
        the attempt is fully identified by the path, and the device comes
        solely from the bearer credential — a device can open only its
        own deliveries, and another device's attempt is a plain 404.
        Idempotent by the attempt's identity: replaying an already-opened
        receipt returns the recorded snapshot without moving the server
        revision (the PUT converges on the one recorded receipt, like the
        digest-addressed attachment upload). The item's lifecycle status
        is deliberately not a gate: a late receipt for a resolved item is
        honest telemetry, and its canonical rendering is the deep-link
        GET's concern (plan §5.14 sync test 9). Deliberately not a
        ClientCommand: a receipt is monotonic telemetry about the past,
        not a judgment on canonical state, and an expected_entity_version
        precondition would wrongly reject legitimate receipts as the
        delivery row advances from submitted to channel_accepted.
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/DeliveryChannel"
        - $ref: "#/components/parameters/DeliveryAttempt"
      responses:
        "200":
          description: >
            The recorded delivery snapshot, whether this request recorded
            the receipt or replayed an already-opened attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttentionDeliverySnapshot"
        "400":
          description: The attempt path segment is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            The authenticated device is no longer active: the handler's
            active-device re-gate refuses the receipt with no effect (plan
            §5.14 sync test 15 posture). A revoked credential normally fails
            the security scheme with 401 before the handler runs; this 403 is
            the residual race where an authorizer still vouches for a device
            revoked in between.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List runs
      description: >
        Lists runs as resource snapshots. Each run embeds its stages and
        attempts (the run is the aggregate root). A partial fetch; it never
        marks the whole cache current (plan §5.14).
      responses:
        "200":
          description: Run snapshots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunSnapshot"

  /runs/{run_id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get one run
      description: Returns the run aggregate (stages and attempts embedded) as a resource snapshot.
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{run_id}/timeline:
    get:
      operationId: getRunTimeline
      tags: [runs]
      summary: Get one run timeline
      description: >
        Returns the daemon-derived milestone, hold, and invocation-observation
        timeline for one run. The snapshot is computed in one store read and
        carries the revision that bounds every fact. A partial fetch; it never
        marks the whole cache current (plan §5.14).
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run timeline snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTimeline"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: List durable schedules
      description: >
        Lists the durable scheduler's synchronized schedule aggregates
        (plan §5.16). A partial fetch; it never marks the whole cache
        current (plan §5.14).
      responses:
        "200":
          description: Schedule snapshots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleSnapshot"

  /conversations/{conversation_id}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get one conversation as a whole snapshot
      description: >
        Phase 1 conversation sync is whole-snapshot per conversation (plan
        §5.14): the response carries the complete ordered message thread
        (daemon-assigned contiguous sequence numbers), not a delta. Messages
        are immutable; corrections are new messages. Attachments are not
        inlined; they are fetched by digest.
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      responses:
        "200":
          description: The conversation snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"

  /commands:
    post:
      operationId: submitCommand
      tags: [commands]
      summary: Submit a client command
      description: |
        The single mutation surface for judgment-bearing decisions on
        synchronized domain state: every such client mutation is a
        ClientCommand (plan §5.14); only the credential control surface
        (pairing, revocation), attachment upload, and the delivery opened
        receipt (monotonic telemetry, reportDeliveryOpened) sit outside
        it. Submission is idempotent by
        `command_id`: the daemon records each command's result in the same
        transaction that applies it, and a retry of an already-committed
        `command_id` returns the original recorded result without applying
        anything again (a lost HTTP response is recovered by retrying, sync
        test 4). Optimistic concurrency: a command prepared against a stale
        `expected_entity_version` (or stale bindings) is rejected with the
        replacement state and no side effect (sync test 2).
      requestBody:
        required: true
        description: The command to apply, prepared against canonical state.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCommand"
      responses:
        "200":
          description: >
            The command's committed result: the original recorded result,
            whether this request applied the command or retried an
            already-committed one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "409":
          description: >
            Optimistic-concurrency rejection: the command's
            expected_entity_version or expected_bindings no longer match
            canonical state. Carries the replacement item snapshot so the
            client can re-render without a refetch (sync test 2). No side
            effect was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaleVersionRejection"

  /pairing:
    post:
      operationId: pairDevice
      tags: [devices]
      summary: Exchange a pairing code for a device credential
      # Unauthenticated by design, with GET /health: the requester has no
      # credential yet, and the short-lived code displayed on the daemon
      # host is the authenticator (plan §5.14 devices).
      security: []
      description: |
        Exchanges a short-lived pairing code (displayed on the daemon host,
        plan §5.14) for a new device, its bearer token, and the device's
        ntfy subscription. The token and subscription appear only in this
        response and are never exposed through Device or the sync surfaces;
        the daemon stores only the token's digest. Consumption is
        single-winner: simultaneous attempts with one code yield one device
        (sync test 14), and an expired or consumed code creates nothing
        (sync test 13).
      requestBody:
        required: true
        description: The pairing code and the device's human label.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingRequest"
      responses:
        "201":
          description: >
            The paired device, its one-time-visible token, and its private
            ntfy subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingGrant"
        "403":
          description: >
            The pairing code is unknown, expired, or already consumed. One
            undifferentiated rejection: the response never distinguishes
            which, so an unauthenticated caller cannot probe code validity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /devices/{device_id}/revoke:
    post:
      operationId: revokeDevice
      tags: [devices]
      summary: Revoke a paired device
      description: |
        Revokes the device's credential (plan §5.14): a revoked device
        cannot submit a previously prepared, uncommitted command (sync test
        15), while a committed command's recorded result stays retrievable
        and a retry produces no new side effect (sync test 16). Revocation
        stops future access only; it cannot delete content the device
        already cached (no remote wipe). Terminal and idempotent: revoking
        an already-revoked device returns the same recorded snapshot.
        Deliberately not a ClientCommand: revocation is the credential
        control surface (it invalidates what commands authenticate with,
        and must not depend on the revoked device's cooperation), not a
        decision on an attention item.
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "200":
          description: The device's snapshot after revocation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"

  /attachments/{digest}:
    parameters:
      - name: digest
        in: path
        required: true
        description: The content digest naming the stored bytes (e.g. `sha256:...`).
        schema:
          $ref: "#/components/schemas/Digest"
    get:
      operationId: getAttachment
      tags: [attachments]
      summary: Fetch an attachment by content digest
      description: >
        Digest-addressed read: returns the stored bytes the path digest
        names. Clients render image attachments directly from the
        artifact store by digest (plan §4), and conversation attachments
        are never inlined (plan §5.14), so this is the read path for the
        bytes an item's evidence_snapshot, agent_claims, and
        artifact_digests and a message's attachments reference. Content
        is immutable per digest.
      responses:
        "200":
          description: The stored bytes for the digest.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: uploadAttachment
      tags: [attachments]
      summary: Upload an attachment by content digest
      description: |
        Digest-addressed upload (plan §5.14): the path digest names the
        content, and the daemon verifies the body hashes to it. A retried
        upload converges on one artifact by digest (sync test 10): re-PUT of
        an already-stored digest is a no-op that returns the same receipt.
        The daemon treats attachment bytes as opaque blobs (magic-byte,
        type, and size validation only; plan §5.15); rendering happens only
        in clients.
      requestBody:
        required: true
        description: The attachment bytes; must hash to the path digest.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The attachment was stored under the digest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentReceipt"
        "200":
          description: >
            The digest was already stored; the upload converged on the
            existing artifact (idempotent retry).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentReceipt"
        "422":
          description: The body does not hash to the path digest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    deviceCredential:
      type: http
      scheme: bearer
      description: >
        The paired-device credential (plan §5.14 devices and commands).
        `POST /pairing` exchanges a short-lived pairing code for it; the
        bearer token is `fsd1.<device_id_b64>.<secret>`, three
        dot-separated segments: the version prefix, the unpadded base64url
        (RFC 4648 §5) encoding of the device identifier, and a 256-bit
        unpadded base64url secret. It is shown once in the PairingGrant
        and never retrievable again. Encoding the identifier segment makes
        the format total over the identifier space: base64url is dot-free,
        so the token always splits into exactly three segments, and every
        character is legal in an HTTP `Authorization: Bearer` credential
        (RFC 6750 token68) no matter what characters the raw identifier
        contains. The
        daemon stores only the whole token's sha256 digest, or a device
        public key, never reusable plaintext; the embedded device_id routes
        verification to that device's stored credential. Revocation
        (`POST /devices/{device_id}/revoke`) stops new work: a revoked
        device cannot submit a new or previously prepared, uncommitted
        command (sync test 15), and a retried already-committed command
        produces no new side effect; whether that retry still authenticates
        to fetch its recorded result, or is refused with the record staying
        retrievable to other devices, is enforcement policy pinned by the
        attention service (test 16 permits either).

  parameters:
    ItemID:
      name: item_id
      in: path
      required: true
      description: The attention item's identifier.
      schema:
        type: string
        minLength: 1
    RunID:
      name: run_id
      in: path
      required: true
      description: The run's identifier.
      schema:
        type: string
        minLength: 1
    ConversationID:
      name: conversation_id
      in: path
      required: true
      description: The conversation's identifier.
      schema:
        type: string
        minLength: 1
    DeviceID:
      name: device_id
      in: path
      required: true
      description: The paired device's identifier.
      schema:
        type: string
        minLength: 1
    DeliveryChannel:
      name: channel
      in: path
      required: true
      description: >
        The delivery channel that carried the attempt (the AttentionDelivery
        channel field, e.g. "ntfy").
      schema:
        type: string
        minLength: 1
    DeliveryAttempt:
      name: attempt
      in: path
      required: true
      description: The 1-based delivery attempt number.
      schema:
        type: integer
        minimum: 1

  responses:
    NotFound:
      description: No entity exists under the identifier.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # --- sync envelope shapes (plan §5.14) ---

    BootstrapSnapshot:
      type: object
      description: >
        One canonical snapshot of every synchronized resource, produced in a
        single read transaction. sync_epoch and revision are the daemon's
        ServerState; every client-visible transaction increments revision,
        and a restore issues a new epoch forcing cache discard.
      required:
        - sync_epoch
        - revision
        - attention_items
        - attention_deliveries
        - runs
        - conversations
        - schedules
      properties:
        sync_epoch:
          type: string
          minLength: 1
          description: The daemon's current sync epoch; changes only on restore.
        revision:
          type: integer
          format: int64
          minimum: 0
          description: >
            The server revision this snapshot was read at; the client's new
            last_full_snapshot_revision.
        attention_items:
          type: array
          items:
            $ref: "#/components/schemas/AttentionItemSnapshot"
        attention_deliveries:
          type: array
          items:
            $ref: "#/components/schemas/AttentionDeliverySnapshot"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunSnapshot"
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSnapshot"
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSnapshot"

    AttentionItemSnapshot:
      type: object
      description: A resource snapshot wrapping one attention item (plan §5.14).
      required: [as_of_revision, entity_version, item]
      properties:
        as_of_revision:
          $ref: "#/components/schemas/AsOfRevision"
        entity_version:
          $ref: "#/components/schemas/EntityVersion"
        item:
          $ref: "#/components/schemas/AttentionItem"

    RunProposalFactsSnapshot:
      type: object
      description: >
        Store-authenticated, digest-bound proposal facts matched to one exact
        attention-item snapshot before the client enables a decision.
      additionalProperties: false
      required:
        - as_of_revision
        - entity_version
        - item_version
        - proposal_digest
        - supersedes
        - intent
        - expected_cost_units
        - scope
      properties:
        as_of_revision:
          $ref: "#/components/schemas/AsOfRevision"
        entity_version:
          $ref: "#/components/schemas/EntityVersion"
        item_version:
          type: integer
          minimum: 1
        proposal_digest:
          $ref: "#/components/schemas/Digest"
        supersedes:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RunProposalRevisionFacts"
          description: >
            The exact authenticated prior facts for a revised card; null for
            the initially admitted proposal.
        intent:
          $ref: "#/components/schemas/RunProposalIntent"
        expected_cost_units:
          type: integer
          minimum: 1
          maximum: 1000000
        scope:
          $ref: "#/components/schemas/RunProposalScope"

    RunProposalRevisionFacts:
      type: object
      description: One digest-bound, bounded side of a proposal revision comparison.
      additionalProperties: false
      required: [proposal_digest, intent, expected_cost_units, scope]
      properties:
        proposal_digest:
          $ref: "#/components/schemas/Digest"
        intent:
          $ref: "#/components/schemas/RunProposalIntent"
        expected_cost_units:
          type: integer
          minimum: 1
          maximum: 1000000
        scope:
          $ref: "#/components/schemas/RunProposalScope"

    RunProposalRevisionInput:
      type: object
      description: >
        Bounded public parameters an operator may revise; the opaque work-unit
        handle and current policy remain store-derived authority.
      additionalProperties: false
      required: [intent, expected_cost_units, scope]
      properties:
        intent:
          $ref: "#/components/schemas/RunProposalIntent"
        expected_cost_units:
          type: integer
          minimum: 1
          maximum: 1000000
        scope:
          $ref: "#/components/schemas/RunProposalScope"

    RunProposalScope:
      type: object
      description: Bounded aggregate scope facts with no paths or target identities.
      additionalProperties: false
      required: [component_count, declared_path_count, touches_control_plane]
      properties:
        component_count:
          type: integer
          minimum: 1
          maximum: 32
        declared_path_count:
          type: integer
          minimum: 1
          maximum: 4096
        touches_control_plane:
          type: boolean

    RunProposalIntent:
      type: string
      description: Closed intent understood by the run-proposal registry.
      enum: [implement_subject]

    AttentionDeliverySnapshot:
      type: object
      description: A resource snapshot wrapping one attention delivery (plan §5.14).
      required: [as_of_revision, entity_version, delivery]
      properties:
        as_of_revision:
          $ref: "#/components/schemas/AsOfRevision"
        entity_version:
          $ref: "#/components/schemas/EntityVersion"
        delivery:
          $ref: "#/components/schemas/AttentionDelivery"

    RunSnapshot:
      type: object
      description: A resource snapshot wrapping one run aggregate (plan §5.14).
      required: [as_of_revision, entity_version, run]
      properties:
        as_of_revision:
          $ref: "#/components/schemas/AsOfRevision"
        entity_version:
          $ref: "#/components/schemas/EntityVersion"
        run:
          $ref: "#/components/schemas/Run"

    RunTimeline:
      type: object
      description: >
        A computed, typed daemon-observation timeline for one run. It carries no
        agent-authored free text; stage and attempt labels come from the Run
        aggregate and join to invocation_id in these facts (plan §9).
      additionalProperties: false
      required: [as_of_revision, as_of, run_id, milestones, hold, invocations]
      properties:
        as_of_revision:
          $ref: "#/components/schemas/AsOfRevision"
        as_of:
          type: string
          format: date-time
          description: The daemon-clock instant at which this timeline was projected.
        run_id:
          type: string
          minLength: 1
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/RunMilestone"
        hold:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RunHold"
        invocations:
          type: array
          items:
            $ref: "#/components/schemas/InvocationObservation"
      example:
        as_of_revision: 42
        as_of: "2026-01-02T03:14:06Z"
        run_id: "run-1"
        milestones:
          - run_id: "run-1"
            kind: "run_submitted"
            invocation_id: "inv-1"
            terminal: null
            outcome: null
            reason: null
            recorded_at: "2026-01-02T03:04:05Z"
          - run_id: "run-1"
            kind: "terminal_recorded"
            invocation_id: "inv-1"
            terminal: "completed"
            outcome: null
            reason: null
            recorded_at: "2026-01-02T03:14:05Z"
        hold: null
        invocations:
          - invocation_id: "inv-1"
            run_id: "run-1"
            status: "completed"
            live: false
            observed_at: "2026-01-02T03:14:05Z"

    RunMilestoneKind:
      type: string
      description: >
        The closed milestone vocabulary mirrored from
        domain.RunMilestoneKind. Widening it is a contract change.
      enum:
        - run_submitted
        - invocation_admitted
        - invocation_started
        - execution_export_recorded
        - execution_outcome_recorded
        - terminal_recorded
        - publication_ready
        - publication_blocked

    RunHoldReason:
      type: string
      description: >
        The closed, operator-safe hold vocabulary mirrored from
        domain.RunHoldReason. Values are typed daemon observations, never free text.
      enum:
        - operation_stopped
        - blocking_system_health
        - input_unavailable
        - backend_not_conformant
        - admission_policy_refused
        - backup_protection_unready
        - repository_untrusted
        - provider_authority_unavailable
        - attended_mode_active
        - publication_environment
        - external_conflict
        - recipe_revoked
        - verification_findings
        - trust_blocked
        - base_advanced
        - identity_parallelism

    RunOutcome:
      type: string
      description: >
        The daemon-derived run result mirrored from domain.RunOutcome.
        Pending can coexist with a current hold; blocked means a definitive
        publication_blocked milestone, not merely a transient hold.
        A run with no observation history (a pre-migration-0024 legacy run,
        which is deliberately not backfilled, and with no nonterminal
        invocation observation) classifies as unobserved, never pending, so a
        legacy terminal run is not shown as in flight; a legacy run still
        executing across the upgrade has a nonterminal invocation observation
        and reports pending.
      enum: [unobserved, pending, published, blocked, failed, lost]

    ObservedInvocationStatus:
      type: string
      description: The daemon's closed observation-side invocation lifecycle.
      enum: [pending, running, completed, failed, canceled, gone]

    ExecutionOutcomeStatus:
      type: string
      description: The closed non-export terminal authority vocabulary.
      enum: [failed, canceled, lost]

    RunMilestone:
      type: object
      description: >
        One append-only, first-observation-wins daemon milestone. Detail
        fields are kind-scoped and use explicit null when absent.
      additionalProperties: false
      required: [run_id, kind, invocation_id, terminal, outcome, reason, recorded_at]
      properties:
        run_id:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/RunMilestoneKind"
        invocation_id:
          type: string
          minLength: 1
          nullable: true
        terminal:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ObservedInvocationStatus"
        outcome:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ExecutionOutcomeStatus"
        reason:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RunHoldReason"
        recorded_at:
          type: string
          format: date-time

    RunHold:
      type: object
      description: The daemon's current typed hold observation for one run.
      additionalProperties: false
      required: [run_id, invocation_id, reason, first_observed_at, last_observed_at]
      properties:
        run_id:
          type: string
          minLength: 1
        invocation_id:
          type: string
          minLength: 1
          nullable: true
        reason:
          $ref: "#/components/schemas/RunHoldReason"
        first_observed_at:
          type: string
          format: date-time
        last_observed_at:
          type: string
          format: date-time

    InvocationObservation:
      type: object
      description: The daemon's latest observation of one run invocation.
      additionalProperties: false
      required: [invocation_id, run_id, status, live, observed_at]
      properties:
        invocation_id:
          type: string
          minLength: 1
        run_id:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/ObservedInvocationStatus"
        live:
          type: boolean
        observed_at:
          type: string
          format: date-time

    ConversationSnapshot:
      type: object
      description: A resource snapshot wrapping one whole conversation (plan §5.14).
      required: [as_of_revision, entity_version, conversation]
      properties:
        as_of_revision:
          $ref: "#/components/schemas/AsOfRevision"
        entity_version:
          $ref: "#/components/schemas/EntityVersion"
        conversation:
          $ref: "#/components/schemas/Conversation"

    ScheduleSnapshot:
      type: object
      description: A resource snapshot wrapping one durable schedule (plan §5.14, §5.16).
      required: [as_of_revision, entity_version, schedule]
      properties:
        as_of_revision:
          $ref: "#/components/schemas/AsOfRevision"
        entity_version:
          $ref: "#/components/schemas/EntityVersion"
        schedule:
          $ref: "#/components/schemas/Schedule"

    ScheduleKind:
      type: string
      description: >
        The closed union of durable schedule kinds (plan §5.16; mirrors
        domain.ScheduleKind): the four 1B timer kinds and the permanent
        trusted-config jobs. Widening it is a contract change.
      enum:
        - pr_checks_deadline
        - review_wait_threshold
        - base_advance_watch
        - installation_poll
        - doctor
        - janitor

    ScheduleStatus:
      type: string
      description: >
        A schedule's lifecycle state (mirrors domain.ScheduleStatus): armed
        is live; fired is a one-shot deadline that terminated
        fired-and-handled; resolved was explicitly resolved (the awaited
        condition arrived, or the subject concluded); expired ended with
        its validity window.
      enum: [armed, fired, resolved, expired]

    ScheduleResolutionReason:
      type: string
      description: >
        The closed vocabulary of terminal causes (mirrors
        domain.ScheduleResolutionReason); a code, never free text.
      enum: [deadline_elapsed, condition_satisfied, subject_concluded, intent_expired]

    ScheduleResolution:
      type: object
      description: >
        How and when a schedule's generation terminated; present exactly on
        terminal schedules (mirrors domain.ScheduleResolution).
      required: [reason, recorded_at]
      properties:
        reason:
          $ref: "#/components/schemas/ScheduleResolutionReason"
        recorded_at:
          type: string
          format: date-time

    ScheduleSubjectType:
      type: string
      description: >
        The class of durable subject a schedule is bound to (mirrors
        domain.ScheduleSubjectType).
      enum: [attention_item, installation_intent, trusted_config]

    ScheduleSubject:
      type: object
      description: >
        The schedule's subject binding and the expected subject version its
        consuming handler rechecks (plan §5.16; mirrors
        domain.ScheduleSubject). Fields are type-scoped: attention_item
        subjects carry item_id and item_version; installation_intent
        subjects carry the §5.9 activation coordinates (registration,
        active epoch, durable intent revision); trusted_config subjects
        carry neither.
      required:
        - type
        - item_id
        - item_version
        - registration_id
        - active_epoch
        - durable_intent_revision
      properties:
        type:
          $ref: "#/components/schemas/ScheduleSubjectType"
        item_id:
          type: string
          minLength: 1
          nullable: true
        item_version:
          type: integer
          minimum: 1
          nullable: true
        registration_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        active_epoch:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        durable_intent_revision:
          type: integer
          format: int64
          minimum: 1
          nullable: true

    ScheduleBaseWatch:
      type: object
      description: >
        Kind-scoped detail of a base_advance_watch (mirrors
        domain.ScheduleBaseWatch): the repository, target base ref, and the
        base tip the publication was admitted against, daemon-recorded from
        the trusted authorization.
      required: [repo, base_ref, admitted_base_sha]
      properties:
        repo:
          type: string
          minLength: 1
        base_ref:
          type: string
          minLength: 1
        admitted_base_sha:
          type: string
          minLength: 1

    Schedule:
      type: object
      description: >
        One durable deferred check (plan §5.16; mirrors domain.Schedule):
        the synchronized aggregate carrying the subject binding, cadence or
        deadline, expiry, and terminal resolution. The rolling
        next-nominal-fire clock and the occurrence ledger are
        daemon-internal bookkeeping, deliberately absent from this surface.
        run_id and policy_digest are present exactly for attention-item
        workload kinds and bind their fire-time authority independently.
        fire_at is present exactly for one-shot kinds; interval_seconds
        exactly for recurring kinds; base_watch exactly for
        base_advance_watch; resolution exactly when status is terminal.
      required:
        - id
        - project_id
        - kind
        - subject
        - run_id
        - policy_digest
        - generation
        - created_at
        - fire_at
        - interval_seconds
        - expires_at
        - base_watch
        - status
        - resolution
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        subject:
          $ref: "#/components/schemas/ScheduleSubject"
        run_id:
          type: string
          minLength: 1
          nullable: true
        policy_digest:
          type: string
          minLength: 1
          nullable: true
        generation:
          type: integer
          format: int64
          minimum: 1
          description: Increments on every re-arm; occurrence identity binds to it.
        created_at:
          type: string
          format: date-time
        fire_at:
          type: string
          format: date-time
          nullable: true
        interval_seconds:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        base_watch:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleBaseWatch"
        status:
          $ref: "#/components/schemas/ScheduleStatus"
        resolution:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleResolution"
      example:
        id: "schedule-pr_checks_deadline-item-1"
        project_id: "project-1"
        kind: "pr_checks_deadline"
        subject:
          type: "attention_item"
          item_id: "item-1"
          item_version: 1
          registration_id: null
          active_epoch: null
          durable_intent_revision: null
        run_id: "run-1"
        policy_digest: "sha256:dc1af0d4d3c8cdc2f6b59b72234a6988199c4d9dd9c3f2e663452eb58cd97ca7"
        generation: 1
        created_at: "2026-01-02T03:04:05Z"
        fire_at: "2026-01-02T03:34:05Z"
        interval_seconds: null
        expires_at: null
        base_watch: null
        status: "fired"
        resolution:
          reason: "deadline_elapsed"
          recorded_at: "2026-01-02T03:35:05Z"

    ServerRevision:
      type: object
      description: >
        The revision heartbeat's payload (plan §5.14; sync test 11): the
        daemon's current ServerState, cheap enough to poll. Carries no
        entity data; a revision gap tells the client to refetch, never to
        mark its cache current.
      required: [sync_epoch, revision]
      additionalProperties: false
      properties:
        sync_epoch:
          type: string
          minLength: 1
          description: >
            The daemon's sync epoch at the moment of the read; a change
            (only ever a restore) invalidates every client cache.
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The server revision at the moment of the read.
      example:
        sync_epoch: "a1b2c3d4e5f60718293a4b5c6d7e8f90"
        revision: 42

    DeviceSnapshot:
      type: object
      description: A resource snapshot wrapping one paired device (plan §5.14).
      required: [as_of_revision, entity_version, device]
      properties:
        as_of_revision:
          $ref: "#/components/schemas/AsOfRevision"
        entity_version:
          $ref: "#/components/schemas/EntityVersion"
        device:
          $ref: "#/components/schemas/Device"

    AsOfRevision:
      type: integer
      format: int64
      minimum: 1
      description: >
        The server revision of the transaction that last wrote this entity
        (plan §5.14); lets a client detect revision gaps per resource.

    EntityVersion:
      type: integer
      format: int64
      minimum: 1
      description: >
        The entity's monotonic per-row version, incremented on every write;
        the value a ClientCommand's expected_entity_version is checked
        against.

    # --- commands (plan §5.14 devices and commands) ---

    ClientCommand:
      type: object
      description: >
        Every client mutation. Carries exactly these five fields. The
        payload is now typed for the decision command (the first exercised
        command type); other command types are typed as the signet/saddle
        pair exercises the surface, via kind:contract changes.
      required:
        - command_id
        - device_id
        - expected_entity_version
        - expected_bindings
        - payload
      additionalProperties: false
      properties:
        command_id:
          type: string
          minLength: 1
          description: >
            Client-generated idempotency key; a retry with the same
            command_id returns the original recorded result.
        device_id:
          type: string
          minLength: 1
          description: The paired device submitting the command.
        expected_entity_version:
          type: integer
          format: int64
          minimum: 1
          description: >
            The entity_version of the target entity the command was
            prepared against; a mismatch rejects the command with the
            replacement state.
        expected_bindings:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Digest"
          description: >
            Provisional. The digest-bound inputs the command was prepared
            against, keyed by binding name; checked with
            expected_entity_version. For a decision command the authoritative
            binding set is the payload's item_version, pr_head_sha, and
            artifact_digests (the daemon cross-checks those against the live
            item); this map stays for command types that name individual
            bindings.
        payload:
          $ref: "#/components/schemas/DecisionPayload"
      example:
        command_id: "cmd-1"
        device_id: "device-1"
        expected_entity_version: 1
        expected_bindings:
          evidence: "sha256:log"
        payload:
          item_id: "item-1"
          action: "open_pr"
          item_version: 1
          pr_head_sha: "cafebabe"
          artifact_digests: ["sha256:img", "sha256:log"]

    DecisionPayload:
      type: object
      description: >
        The payload of a decision command: which attention item is decided,
        the action taken, and the exact bindings the decision was rendered
        against (the accepted item version, PR head, and the rendered digest
        set). The daemon cross-checks these against the live item, so an
        approval cannot commit against inputs that changed after it was
        rendered (the stale-approval class, plan §3.1; §4 "approvals bind to
        digests"). Mirrors the binding fields of domain.Command.
      required: [item_id, action, item_version, pr_head_sha, artifact_digests]
      additionalProperties: false
      properties:
        item_id:
          type: string
          minLength: 1
          description: The attention item being decided.
        action:
          $ref: "#/components/schemas/Action"
        item_version:
          type: integer
          minimum: 1
          description: The accepted item_version the decision was rendered against.
        pr_head_sha:
          type: string
          description: >
            The PR head the decision bound to; empty when the item names no
            PR (e.g. a spec awaiting approval).
        artifact_digests:
          type: array
          items:
            $ref: "#/components/schemas/Digest"
          description: >
            The canonical (sorted, deduplicated) binding set: exactly the
            digests rendered in the item's evidence_snapshot and agent_claims.
        message:
          type: string
          description: >
            Human-authored text for message-carrying decisions. Required for
            discuss, request_changes, answer_and_retry,
            answer_without_retry, and return_to_agent; absent for pure
            decisions. The daemon binds it to the versioned command and
            applies each action's size and attachment policy.
        capability_manifest_digest:
          allOf:
            - $ref: "#/components/schemas/Digest"
          description: >
            The offered capability manifest selected by
            retry_with_capabilities. Required only for that action; the daemon
            re-derives the manifest from the run's current resolved policy.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Digest"
          description: >
            Digest addresses of attachments already uploaded via PUT
            /attachments/{digest}, referenced by the appended message. Unlike
            artifact_digests this is ordered message content, not a binding
            set: order is preserved, never canonicalized.
        run_proposal_revision:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RunProposalRevisionInput"
          description: >
            Typed replacement parameters, present only for
            start_with_changes. The daemon preserves the current opaque
            subject handle, re-resolves its declaration and policy, and
            computes the revised digest inside the accepting transaction.
        snooze_until:
          type: string
          format: date-time
          nullable: true
          description: >
            Typed UTC deferral instant, present only for snooze. The daemon
            requires a future canonical instant and records it in the proposal
            ledger.
        alternative_choices:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AlternativeChoice"
          description: >
            Per-finding offered routes selected by choose_alternative_route.
            Findings omitted from this list retain their recommended route.
            Absent for every other action; finding IDs must be distinct.
      example:
        item_id: "item-1"
        action: "open_pr"
        item_version: 1
        pr_head_sha: "cafebabe"
        artifact_digests: ["sha256:img", "sha256:log"]

    CommandRecord:
      type: object
      description: >
        The durable, immutable record of one accepted decision
        (domain.Command; plan §4 lifecycle, §5.14). It pins the exact
        bindings the decision was accepted against; the daemon keys it by
        command_id and a retry returns it unchanged (sync test 4).
      required:
        - command_id
        - device_id
        - item_id
        - item_version
        - pr_head_sha
        - artifact_digests
        - action
        - message
        - attachments
      additionalProperties: false
      properties:
        command_id:
          type: string
          minLength: 1
        device_id:
          type: string
          minLength: 1
        item_id:
          type: string
          minLength: 1
        item_version:
          type: integer
          minimum: 1
        pr_head_sha:
          type: string
        artifact_digests:
          type: array
          items:
            $ref: "#/components/schemas/Digest"
        action:
          $ref: "#/components/schemas/Action"
        message:
          type: string
          description: >
            The conversation message the command carried (discuss); empty
            for pure decisions. The record always renders both content
            fields, empty or not, so the write-once body has one byte-form.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Digest"
          description: >
            The appended message's attachment digests in authored order;
            empty for pure decisions.
      example:
        command_id: "cmd-1"
        device_id: "device-1"
        item_id: "item-1"
        item_version: 1
        pr_head_sha: "cafebabe"
        artifact_digests: ["sha256:img", "sha256:log"]
        action: "open_pr"
        message: ""
        attachments: []

    CommandResult:
      type: object
      description: >
        The command's committed result: the durable decision record plus the
        server revision the transaction applied at. A retry of the same
        command_id returns this exact value (sync test 4).
      required: [record, revision]
      additionalProperties: false
      properties:
        record:
          $ref: "#/components/schemas/CommandRecord"
        revision:
          type: integer
          format: int64
          minimum: 1
          description: The server revision of the transaction that applied the command.
      example:
        record:
          command_id: "cmd-1"
          device_id: "device-1"
          item_id: "item-1"
          item_version: 1
          pr_head_sha: "cafebabe"
          artifact_digests: ["sha256:img", "sha256:log"]
          action: "open_pr"
          message: ""
          attachments: []
        revision: 1

    StaleVersionRejection:
      type: object
      description: >
        An optimistic-concurrency rejection carrying the replacement item
        snapshot (plan §5.14 sync test 2).
      required: [message, replacement_item]
      properties:
        message:
          type: string
        replacement_item:
          $ref: "#/components/schemas/AttentionItemSnapshot"

    # --- device pairing (plan §5.14 devices) ---

    HealthStatus:
      type: object
      description: >
        Process liveness (plan §5.2): a transport-level status object for
        callers that hold no device credential, not a mirror of a
        synchronized domain type. `status` is fixed at `ok` because
        liveness is proven by answering; degraded operational states are
        deliberately not disclosed here (plan §4 owns them, behind
        authentication).
      required: [status, version, started_at]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
          description: Fixed at `ok`; liveness is proven by answering at all.
        version:
          type: string
          minLength: 1
          description: >
            The daemon build version, for operator-client skew detection.
        started_at:
          type: string
          format: date-time
          description: >
            The current process's start time (RFC3339 UTC). Under a
            supervisor, a start time that keeps advancing across polls is
            crash-loop evidence.
      example:
        status: "ok"
        version: "0.1.0"
        started_at: "2026-01-02T03:04:05Z"

    PairingRequest:
      type: object
      description: >
        The pairing exchange's input: the short-lived code read off the
        daemon host and the human label the new device will carry.
      required: [pairing_code, display_name]
      additionalProperties: false
      properties:
        pairing_code:
          type: string
          minLength: 1
          description: >
            The code plaintext as displayed. The daemon re-derives its keyed
            digest (HMAC-SHA256 under a daemon-held pairing key) for lookup
            and stores no plaintext; the keyed derivation keeps a short
            displayed code from being offline-brute-forced out of a leaked
            store.
        display_name:
          type: string
          minLength: 1
          description: The device's human label ("Ben's iPhone").
      example:
        pairing_code: "483911"
        display_name: "Ben's iPhone"

    PairingGrant:
      type: object
      description: >
        The successful pairing exchange: the new device's snapshot and its
        bearer token plus the device-scoped ntfy subscription. This response
        is the only surface for either private value; neither is exposed on
        Device or through sync, so another device cannot enumerate the topic.
        The daemon stores only the token's digest, so a lost token means
        revoking the device and pairing again.
      required: [device_token, device, ntfy_subscription]
      additionalProperties: false
      properties:
        device_token:
          type: string
          minLength: 1
          description: >
            The bearer token (`fsd1.<device_id_b64>.<secret>`; see the
            deviceCredential security scheme for the segment encoding).
            Shown once; never retrievable again.
        device:
          $ref: "#/components/schemas/DeviceSnapshot"
        ntfy_subscription:
          $ref: "#/components/schemas/NtfySubscription"
      example:
        device_token: "fsd1.ZGV2aWNlLTE.3q2-8fPXm4kQzT1vY6wA9rB0cD5eF7gH8jK2lM4nP6s"
        device:
          as_of_revision: 1
          entity_version: 1
          device:
            id: "device-1"
            display_name: "Ben's iPhone"
            status: "active"
            paired_at: "2026-01-02T03:04:05Z"
            revoked_at: null
        ntfy_subscription:
          server_url: "https://ntfy.sh"
          topic: "fs-4f18d17fc6a57b18b4e4fc8f2c3c85e4"

    NtfySubscription:
      type: object
      description: >
        Everything this device needs to subscribe for read-only notification
        hints. The topic is a stable per-device capability derived under a
        daemon-held key; it must be kept private and is never client-computable.
      required: [server_url, topic]
      additionalProperties: false
      properties:
        server_url:
          type: string
          format: uri
          description: The ntfy server base URL to subscribe against.
        topic:
          type: string
          pattern: '^fs-[0-9a-f]{32}$'
          description: The device's private, unguessable ntfy topic.

    AttachmentReceipt:
      type: object
      description: The stored attachment's digest reference.
      required: [digest]
      properties:
        digest:
          $ref: "#/components/schemas/Digest"

    Error:
      type: object
      description: A plain error message.
      required: [message]
      properties:
        message:
          type: string

    # --- domain mirrors (daemon/internal/domain, field-for-field) ---

    Digest:
      type: string
      minLength: 1
      description: A content digest, algorithm-prefixed (e.g. `sha256:...`).

    PRReference:
      type: object
      description: >
        The structured identity of a published GitHub pull request. Mirrors
        domain.PRReference; clients compose the browser URL from these
        coordinates instead of parsing presentation prose.
      required: [repo, number]
      properties:
        repo:
          type: string
          minLength: 3
          pattern: "^[^/]+/[^/]+$"
        number:
          type: integer
          minimum: 1

    ReadinessSummary:
      type: object
      description: >
        The daemon-evaluated ready class and the digest of the exact
        evaluation set that produced it. This is a narrow projection of the
        full readiness verdict: blocked is not representable on a ready item.
      required:
        - class
        - evaluation_set_digest
      properties:
        class:
          type: string
          enum:
            - ready_clean
            - ready_degraded
        evaluation_set_digest:
          $ref: "#/components/schemas/Digest"

    ReviewYieldRound:
      type: object
      description: >
        The daemon-derived yield totals for one persisted routed-review
        round. New and recurring findings are classified by stable finding
        fingerprint against earlier rounds in the same reviewer-configuration
        segment; dispositions remain attributed to the round that produced
        the finding.
      required:
        - round
        - findings_ingested
        - new_findings
        - recurring_findings
        - fixed
        - declined
        - deferred
        - outcome
      additionalProperties: false
      properties:
        round:
          type: integer
          minimum: 1
        findings_ingested:
          type: integer
          minimum: 0
        new_findings:
          type: integer
          minimum: 0
        recurring_findings:
          type: integer
          minimum: 0
        fixed:
          type: integer
          minimum: 0
        declined:
          type: integer
          minimum: 0
        deferred:
          type: integer
          minimum: 0
        outcome:
          $ref: "#/components/schemas/ReviewOutcome"

    ReviewYieldHistory:
      type: object
      description: >
        The immutable review-yield digest derived from persisted review
        records and finding dispositions when review reaches a convergence
        decision or a candidate becomes ready.
      required: [rounds, terminal_outcome]
      additionalProperties: false
      properties:
        rounds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReviewYieldRound"
        terminal_outcome:
          $ref: "#/components/schemas/ReviewOutcome"

    RecommendationSource:
      type: string
      description: The closed authority class behind an item recommendation.
      enum: [daemon_policy, agent_judgment, project_policy]

    JudgmentSite:
      type: string
      description: A declared daemon-side judgment site (plan §5.13).
      enum: [finding_adjudicator]

    DaemonPolicyRecommendationProvenance:
      type: object
      description: The registered daemon rule and canonical input behind a deterministic recommendation.
      additionalProperties: false
      required: [rule_digest, input_digest]
      properties:
        rule_digest:
          $ref: "#/components/schemas/Digest"
        input_digest:
          $ref: "#/components/schemas/Digest"

    AgentJudgmentRecommendationProvenance:
      type: object
      description: The declared judgment invocation and bound artifact behind an agent recommendation.
      additionalProperties: false
      required: [judgment_site, invocation_id, artifact_digest]
      properties:
        judgment_site:
          $ref: "#/components/schemas/JudgmentSite"
        invocation_id:
          type: string
          minLength: 1
        artifact_digest:
          $ref: "#/components/schemas/Digest"

    ProjectPolicyRecommendationProvenance:
      type: object
      description: The resolved project policy and authenticated application behind a policy recommendation.
      additionalProperties: false
      required: [policy_key, resolved_policy_digest, application_digest]
      properties:
        policy_key:
          type: string
          minLength: 1
        resolved_policy_digest:
          $ref: "#/components/schemas/Digest"
        application_digest:
          $ref: "#/components/schemas/Digest"

    RecommendationProvenance:
      type: object
      additionalProperties: false
      description: >
        Closed source-specific provenance. Exactly one property is non-null,
        and it must match Recommendation.source. This nullable-property shape
        mirrors the Go contract without a wire discriminator.
      required: [daemon_policy, agent_judgment, project_policy]
      properties:
        daemon_policy:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DaemonPolicyRecommendationProvenance"
        agent_judgment:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentJudgmentRecommendationProvenance"
        project_policy:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ProjectPolicyRecommendationProvenance"

    Recommendation:
      type: object
      description: A daemon-derived lead that selects one action already offered by the attention item.
      additionalProperties: false
      required: [action, reason, source, provenance, confidence]
      properties:
        action:
          $ref: "#/components/schemas/Action"
        reason:
          type: string
          minLength: 1
        source:
          $ref: "#/components/schemas/RecommendationSource"
        provenance:
          $ref: "#/components/schemas/RecommendationProvenance"
        confidence:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AdjudicationConfidence"

    DecisionSurfaceRef:
      type: object
      additionalProperties: false
      description: >
        The daemon-owned epoch and digest identifying this item's current
        structural decision surface. Both fields mirror the authoritative
        persisted row and are never client-set.
      required: [epoch, digest]
      properties:
        epoch:
          type: integer
          minimum: 1
        digest:
          $ref: "#/components/schemas/Digest"

    DisplayNameSource:
      type: string
      description: Whether a display label is a chosen name or an explicit identifier fallback.
      enum: [name, identifier]

    DisplayName:
      type: object
      description: One daemon-authored display label and whether it is a name or identifier fallback.
      additionalProperties: false
      required: [text, source]
      properties:
        text:
          type: string
          minLength: 1
        source:
          $ref: "#/components/schemas/DisplayNameSource"

    DisplayNames:
      type: object
      description: Human-readable project and work-unit labels for a card or run row.
      additionalProperties: false
      required: [project, work_unit]
      properties:
        project:
          $ref: "#/components/schemas/DisplayName"
        work_unit:
          $ref: "#/components/schemas/DisplayName"

    CostSoFar:
      type: object
      description: Billable cost observations aggregated across completed invocations.
      additionalProperties: false
      required: [currency, amount, invocations, complete]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        invocations:
          type: integer
          minimum: 1
        complete:
          type: boolean

    StageName:
      type: string
      description: The workflow stage that owns an execution outcome.
      enum: [elaboration, implementation, review, verification]

    ExecutionFailureFacts:
      type: object
      description: The terminal execution outcome and invocation that failed within a workflow stage.
      additionalProperties: false
      required: [outcome, stage, invocation_id]
      properties:
        outcome:
          $ref: "#/components/schemas/ExecutionOutcomeStatus"
        stage:
          $ref: "#/components/schemas/StageName"
        invocation_id:
          type: string
          minLength: 1
        offered_manifests:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityManifestOffer"
          description: >
            Canonically name-sorted capability alternatives that the current
            daemon composition can enforce and that differ from the failed
            admission. Presence is what authorizes retry_with_capabilities.

    CapabilityManifestOffer:
      type: object
      description: A policy-derived capability manifest offered for an execution retry.
      additionalProperties: false
      required: [name, egress_profile, digest]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '^[ -~]+$'
        egress_profile:
          type: string
          enum: [provider_only, provider_web_read, clean_verification]
        digest:
          $ref: "#/components/schemas/Digest"

    TrustRule:
      type: string
      description: A definitive publication trust rule surfaced on a blocked card.
      enum: [recipe_unapproved, verification_failed, trust_profile_drift, target_base_advanced]

    PublishBlockFacts:
      type: object
      additionalProperties: false
      description: Exactly one of hold_reason or trust_rule is non-null.
      required: [hold_reason, trust_rule]
      properties:
        hold_reason:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RunHoldReason"
        trust_rule:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TrustRule"

    DiffStats:
      type: object
      description: Prospective change counts bound to the exact base and head revisions.
      additionalProperties: false
      required: [files_changed, additions, deletions, base_sha, head_sha]
      properties:
        files_changed:
          type: integer
          minimum: 0
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        base_sha:
          type: string
          minLength: 1
        head_sha:
          type: string
          minLength: 1

    SpecDiff:
      type: object
      description: A bounded unified line diff and its complete line counts.
      additionalProperties: false
      required: [lines_added, lines_removed, unified, truncated]
      properties:
        lines_added:
          type: integer
          minimum: 0
        lines_removed:
          type: integer
          minimum: 0
        unified:
          type: string
          minLength: 1
          maxLength: 65536
        truncated:
          type: boolean

    SpecRevisionComment:
      type: object
      description: One durable operator comment that caused a specification revision.
      additionalProperties: false
      required: [comment_id, artifact_id, digest, raised_on_item_id, iteration, body]
      properties:
        comment_id:
          type: string
          minLength: 1
        artifact_id:
          type: string
          minLength: 1
        digest:
          $ref: "#/components/schemas/Digest"
        raised_on_item_id:
          type: string
          minLength: 1
        iteration:
          type: integer
          minimum: 1
        body:
          type: string
          minLength: 1
          maxLength: 8192

    SpecAddressalClaim:
      type: object
      description: The agent's claimed response to one known operator comment.
      additionalProperties: false
      required: [comment_id, response]
      properties:
        comment_id:
          type: string
          minLength: 1
        response:
          type: string
          minLength: 1
          maxLength: 8192

    SpecRevisionFacts:
      type: object
      description: >
        Authenticated facts for a revised specification approval card. Comment
        bodies and claimed addressals are bound to durable artifact digests;
        the claims are displayed as agent statements, not verified outcomes.
      additionalProperties: false
      required:
        - iteration
        - prior_item_id
        - prior_spec_artifact_id
        - prior_spec_digest
        - diff
        - prior_comments
        - claimed_addressals
        - addressals_digest
      properties:
        iteration:
          type: integer
          minimum: 2
        prior_item_id:
          type: string
          minLength: 1
        prior_spec_artifact_id:
          type: string
          minLength: 1
        prior_spec_digest:
          $ref: "#/components/schemas/Digest"
        diff:
          $ref: "#/components/schemas/SpecDiff"
        prior_comments:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/SpecRevisionComment"
        claimed_addressals:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/SpecAddressalClaim"
        addressals_digest:
          $ref: "#/components/schemas/Digest"

    BlockedWaitKind:
      type: string
      description: The authority or event a blocked work unit is waiting on.
      enum: [spec_approval, pr_checks, external_review]

    BlockedWait:
      type: object
      additionalProperties: false
      description: The reference variant must match kind.
      required: [kind, since, item_id, pr_reference]
      properties:
        kind:
          $ref: "#/components/schemas/BlockedWaitKind"
        since:
          type: string
          format: date-time
        item_id:
          type: string
          minLength: 1
          nullable: true
        pr_reference:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PRReference"

    ImpairedCapability:
      type: string
      description: The operator capability currently affected by a health diagnostic.
      enum: [unattended_admission, run_visibility, agent_credential, none]

    HealthDiagnostic:
      type: object
      description: A daemon diagnostic code and its current operational impact.
      additionalProperties: false
      required: [code, impairs]
      properties:
        code:
          type: string
          pattern: '^[a-z0-9][a-z0-9_.-]*$'
        impairs:
          $ref: "#/components/schemas/ImpairedCapability"

    ReviewDisputeBinding:
      type: object
      description: Disputed finding identities bound to one completed review round.
      additionalProperties: false
      required: [run_id, round, finding_ids, completion_evidence]
      properties:
        run_id:
          type: string
          minLength: 1
        round:
          type: integer
          minimum: 1
        finding_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        completion_evidence:
          $ref: "#/components/schemas/Digest"

    AttentionItem:
      type: object
      description: >
        A decision request (plan §4); mirrors domain.AttentionItem.
        item_version increments on every state change and version-binds
        client decisions; timing is daemon-derived, never client-set.
      required:
        - id
        - project_id
        - subject
        - type
        - priority
        - reason
        - requested_decision
        - recommendation
        - decision_surface
        - evidence_snapshot
        - agent_claims
        - artifact_digests
        - pr_head_sha
        - pr_reference
        - readiness
        - yield_history
        - commit_plan_notice
        - base_freshness
        - readiness_invalidation
        - review_recovery_binding
        - codex_reenrollment_recovery_binding
        - review_configuration_recovery
        - finding_adjudication
        - display_names
        - billable_cost_so_far
        - execution_failure
        - publish_block
        - diff_stats
        - blocked_on
        - health_diagnostic
        - review_dispute
        - spec_revision
        - item_version
        - interruption_class
        - conversation_id
        - timing
        - created_at
        - expires_when
        - decided_at
        - posture
        - blocking_supersession
        - status
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        subject:
          $ref: "#/components/schemas/Subject"
        type:
          $ref: "#/components/schemas/AttentionType"
        priority:
          $ref: "#/components/schemas/Priority"
        reason:
          type: string
        requested_decision:
          # May be empty: the read-only `blocked` type offers no action
          # (plan §4). Which types must offer at least one action is signet
          # policy, enforced server-side, not schema structure.
          type: array
          items:
            $ref: "#/components/schemas/Action"
        recommendation:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Recommendation"
          description: >
            The optional daemon-derived lead for this exact decision surface.
            Null means every requested action is equally weighted. A present
            recommendation selects one requested_decision member and never
            widens or reorders the offered set.
        decision_surface:
          $ref: "#/components/schemas/DecisionSurfaceRef"
        evidence_snapshot:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceArtifact"
        agent_claims:
          type: array
          items:
            $ref: "#/components/schemas/AgentClaim"
        artifact_digests:
          type: array
          items:
            $ref: "#/components/schemas/Digest"
          description: >
            The approval binding set: the canonical (sorted, deduplicated)
            union of every digest rendered in evidence_snapshot and
            agent_claims, plus the adjudication_digest rendered in a
            finding_adjudication binding. Derived and enforced by the daemon
            (domain.NewAttentionItem / Validate), never client-supplied, so
            an item cannot display one digest while binding another (the
            stale-approval class, plan §3.1; §4 "approvals bind to digests").
        pr_head_sha:
          type: string
        pr_reference:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PRReference"
          description: >
            The published pull request behind a ready_for_final_review item
            (plan §4; mirrors domain.AttentionItem.PRReference). Required and
            non-null exactly on that item type; null on every other type.
            Daemon-derived from the trusted publication coordinates, never
            client-set.
        readiness:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReadinessSummary"
          description: >
            The daemon-evaluated readiness class and exact evaluation-set
            digest for this ready_for_final_review item (plan §6; mirrors
            domain.AttentionItem.Readiness). Production-created ready items
            always carry it; null is tolerated for legacy persisted items and
            fake-mode items that did not run Section 6 verification. It is
            fixed at creation and never client-set.
        yield_history:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReviewYieldHistory"
          description: >
            The daemon-derived per-round review yield for this
            ready_for_final_review or review_diminishing_returns item (mirrors
            domain.AttentionItem.YieldHistory). Production-created ready items
            always carry it; null is tolerated for legacy persisted items,
            fake-mode items, and diminishing items created before their
            producer lands. It is fixed at creation and never client-set.
        commit_plan_notice:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CommitPlanNoticeReason"
          description: >
            The daemon-derived commit-plan notice (plan §5.6; mirrors
            domain.AttentionItem.CommitPlanNotice): set when the reserved
            plan channel was consumed without a plan structuring the
            import, null otherwise. Classified by the daemon, never
            client-set; null until emission lands (#212).
        base_freshness:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BaseFreshness"
          description: >
            The base-advance staleness watch's maintained fact (plan §5.16;
            mirrors domain.AttentionItem.BaseFreshness): the daemon's last
            observation of the item's target base against the admitted
            base. Present only on ready_for_final_review items once the
            watch has observed the base; updated on material change only,
            with the version bump that a real base advance implies. Never
            client-set.
        readiness_invalidation:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReadinessInvalidation"
          description: >
            The daemon-recorded fact that this ready_for_final_review item's
            clean-pass claim was invalidated by a base/head/identity change
            the review was not run against (plan §7; mirrors
            domain.AttentionItem.ReadinessInvalidation). Written in the same
            transaction that supersedes the item, so the staleness is
            item-visible and the version bump stales any command prepared
            against the old ready claim. Present only on a superseded ready
            item; null otherwise. Never client-set.
        review_recovery_binding:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReviewRecoveryBinding"
          description: >
            The exact persisted contradiction this review_contradiction item
            offers to recover (issue #580; mirrors
            domain.AttentionItem.ReviewRecoveryBinding). It binds the run,
            invocation, round, base, head, and immutable failure-row body
            digest displayed to the operator; null on every other item.
        codex_reenrollment_recovery_binding:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CodexReenrollmentRecoveryBinding"
          description: >
            The exact completed and verified auth-store replacement that may
            resolve a revoked Codex identity's system_health item (issue #684;
            mirrors domain.AttentionItem.CodexReenrollmentRecoveryBinding).
            Null while re-enrollment is pending or failed and on unrelated
            items; immutable once projected onto the open marker.
        review_configuration_recovery:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReviewConfigurationRecoveryBinding"
          description: >
            The exact parked configuration-class review failure this
            review_configuration item offers to recover, and the
            admission-pinned profile it was parked under (issue #611; mirrors
            domain.AttentionItem.ReviewConfigurationRecovery). The adoption
            target is resolved at decision time as the repository's currently
            approved profile revision, so it is deliberately absent here;
            null on every other item.
        finding_adjudication:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/FindingAdjudicationBinding"
          description: >
            The recommendation-led projection of one immutable adjudication
            artifact. Required exactly on finding_adjudication items and null
            elsewhere. The daemon re-gates its proposal axes against the
            artifact named by adjudication_digest before persistence.
        display_names:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DisplayNames"
          description: Daemon-authored project and work-unit labels; null on legacy items.
        billable_cost_so_far:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CostSoFar"
          description: Billable cost observed so far on review_diminishing_returns items.
        execution_failure:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ExecutionFailureFacts"
        publish_block:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PublishBlockFacts"
        diff_stats:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DiffStats"
        blocked_on:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BlockedWait"
        health_diagnostic:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HealthDiagnostic"
        review_dispute:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReviewDisputeBinding"
        spec_revision:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SpecRevisionFacts"
          description: >
            Authenticated revision facts for a revised spec_approval item;
            null on the initial approval and every other item type.
        item_version:
          type: integer
          minimum: 1
        interruption_class:
          $ref: "#/components/schemas/InterruptionClass"
        conversation_id:
          type: string
          minLength: 1
          nullable: true
        timing:
          $ref: "#/components/schemas/TimingSummary"
        created_at:
          type: string
          format: date-time
          nullable: true
          description: >
            The daemon-stamped instant the attention item was created.
            Immutable and never client-set; null only for items persisted
            before this field existed.
        expires_when:
          type: string
          format: date-time
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
          description: >
            The daemon-stamped instant the item's first concluding decision
            was accepted, recorded in the same transaction as the command
            and the status flip; the durable endpoint of the open-to-decision
            metric (plan §4). Never client-set; null while the item is open
            and for items concluded without a decision (expiry, supersession).
        posture:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HealthPosture"
          description: >
            The explicit admission posture of a system_health item (plan §4;
            mirrors domain.AttentionItem.Posture): blocking preserves the
            item's admission-gating effect, while advisory keeps the
            observation open and visible without blocking unrelated unattended
            admission. Required and non-null exactly on system_health items;
            null on every other item type. A blocking_supersession may appear
            only with the blocking posture. Fixed at creation and never
            client-set.
        blocking_supersession:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BlockingSupersession"
          description: >
            The typed condition under which this open system_health item does
            not block unattended admission (plan §4, §5.7; mirrors
            domain.AttentionItem.BlockingSupersession): set at creation by the
            daemon from the validated configuration the item reports on, null
            for every other item and for a health item that blocks
            unconditionally. Never client-set, and never a verdict — the
            daemon re-validates the condition against live policy at each
            admission, so a cleared or retargeted configuration re-blocks the
            still-open item.
        status:
          $ref: "#/components/schemas/ItemStatus"
      example:
