name: daemon CI

# Dual-platform per plan §5.2: Linux runs the full gate (build, test,
# vet, lint); macOS stays lean (build and test only) so portability is
# continuously verified without duplicating the slow checks.

on:
  push:
    branches: [main]
    paths:
      - "daemon/**"
      - "scripts/check.sh"
      - ".github/workflows/daemon-ci.yml"
  pull_request:
    paths:
      - "daemon/**"
      - "scripts/check.sh"
      - ".github/workflows/daemon-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: daemon

jobs:
  linux:
    name: linux (build, test, vet, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go-version-file is resolved from the workspace root, not the
          # working-directory default above.
          go-version-file: daemon/go.mod
          # Superseded by the two caches below; see the rationale there.
          cache: false
      - name: Resolve Go cache paths
        id: go-cache
        # go env, not literal paths: GOCACHE is ~/.cache/go-build on
        # Linux but ~/Library/Caches/go-build on macOS, and this job's
        # cache block then stays identical to its macOS sibling's.
        run: |
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.mod }}
          # Content is fully determined by go.sum, so a primary hit is a
          # complete cache and skipping the save is correct. Kept apart
          # from the build cache below so the rolling key does not
          # re-upload ~80 MB of unchanged modules on every push. The key
          # is deliberately shared with the other Go jobs on this runner
          # OS: on the one run per go.sum that populates it, the loser of
          # that race logs "Failed to save: Unable to reserve cache with
          # key ..., another job may be creating this cache", which is
          # the intended outcome, since the winner's entry is identical.
          key: go-mod-${{ runner.os }}-${{ hashFiles('daemon/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - name: Cache Go build output
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.build }}
          # Rolling key: setup-go's cache keys on go.sum alone, so once
          # an entry existed every run restored it and skipped the save
          # ("Cache hit occurred on the primary key ..., not saving
          # cache"), leaving the daemon's own packages to recompile from
          # scratch each time. The commit suffix makes every run's
          # primary key miss, so each run saves a cache refreshed with
          # what it just compiled, while restore-keys fall back to the
          # newest sibling entry. The job segment keeps the three Go jobs
          # across the two workflows from racing to save one key on a
          # single commit.
          key: go-build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('daemon/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('daemon/go.sum') }}-
            go-build-${{ runner.os }}-${{ github.job }}-
      - name: build, test, vet (scripts/check.sh)
        # The step list lives in scripts/check.sh so local runs and CI
        # cannot drift; the exporter cross-compile guard (#73 acceptance
        # 4) is part of its build step.
        working-directory: .
        run: bash scripts/check.sh daemon build test vet
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned like every other tool: a floating linter is
          # nondeterministic verification, and upgrades are deliberate PRs.
          # The action owns the invocation, so this is the one step CI does
          # not take from scripts/check.sh: golangci-lint-action@v8 has no
          # install-only input, and routing the run through the script would
          # mean replacing the pinned action. scripts/check.sh daemon lint
          # runs the same `golangci-lint run` in daemon/.
          version: v2.12.2
          working-directory: daemon

  race:
    name: linux (race test)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      # Same two caches as the linux job, which carries the rationale. The
      # github.job segment keeps race-instrumented build output isolated.
      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.mod }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('daemon/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - name: Cache Go build output
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.build }}
          key: go-build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('daemon/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('daemon/go.sum') }}-
            go-build-${{ runner.os }}-${{ github.job }}-
      # Per-package timeout raised from the 10m default: cmd/freesided's
      # race-instrumented suite runs ~9m and was crossing 10m under runner
      # load (incident #841). This is a runtime-vs-budget margin, not a hang.
      # Trimming the suite so this ceiling can come back down is deferred.
      - run: go test ./... -race -timeout=20m

  macos:
    name: macos (build, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      # Same two caches as the linux job, which carries the rationale.
      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.mod }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('daemon/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - name: Cache Go build output
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.build }}
          key: go-build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('daemon/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('daemon/go.sum') }}-
            go-build-${{ runner.os }}-${{ github.job }}-
      - name: build, test (scripts/check.sh)
        working-directory: .
        run: bash scripts/check.sh daemon build test
