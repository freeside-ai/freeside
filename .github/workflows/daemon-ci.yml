name: daemon CI

on:
  push:
    branches: [main]
    paths:
      - "daemon/**"
      - "scripts/check.sh"
      - "scripts/daemon-test-shards.py"
      - "scripts/daemon-test-shards.json"
      - ".github/workflows/daemon-ci.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: daemon-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: linux (build, vet, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: Resolve Go cache paths
        id: go-cache
        working-directory: daemon
        run: |
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
          mkdir -p "$(go env GOCACHE)" "$(go env GOMODCACHE)"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.mod }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('daemon/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - name: Cache Go build output
        id: go-build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.go-cache.outputs.build }}
          # Integration shards share one restore namespace and one main-push
          # writer. Go's content-addressed entries also make the old monolithic
          # cache a safe migration source; no test-result cache is reused.
          key: daemon-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-static-${{ hashFiles('daemon/go.sum') }}-${{ github.sha }}
          restore-keys: |
            daemon-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-static-${{ hashFiles('daemon/go.sum') }}-
            go-build-${{ runner.os }}-linux-${{ hashFiles('daemon/go.sum') }}-
      - name: Record static-job identity and cache conditions
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CACHE_HIT: ${{ steps.go-build-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.go-build-cache.outputs.cache-matched-key }}
        run: |
          python3 scripts/daemon-test-shards.py metadata --evidence-dir evidence
          du -sk "$(cd daemon && go env GOCACHE)" "$(cd daemon && go env GOMODCACHE)" >evidence/cache-before.txt
      - name: build, vet (scripts/check.sh)
        run: bash scripts/check.sh daemon build vet
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: daemon
      - name: Record static-job cache size
        if: always()
        run: |
          mkdir -p evidence
          du -sk "$(cd daemon && go env GOCACHE)" "$(cd daemon && go env GOMODCACHE)" >evidence/cache-after.txt
      - name: Upload static-job evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-linux-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
      - name: Save Go build output
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.build }}
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

  linux-tests:
    name: linux (test, ${{ matrix.kind }} ${{ matrix.index }}/${{ matrix.count }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: rest, index: 1, count: 1}
          - {kind: integration, index: 1, count: 3}
          - {kind: integration, index: 2, count: 3}
          - {kind: integration, index: 3, count: 3}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: Resolve Go cache paths
        id: go-cache
        working-directory: daemon
        run: |
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
          mkdir -p "$(go env GOCACHE)" "$(go env GOMODCACHE)"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.mod }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('daemon/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - name: Cache Go build output
        id: go-build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.go-cache.outputs.build }}
          # Integration shards share one restore namespace and one main-push
          # writer. Go's content-addressed entries also make the old monolithic
          # cache a safe migration source; no test-result cache is reused.
          key: daemon-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.kind }}-${{ hashFiles('daemon/go.sum') }}-${{ github.sha }}
          restore-keys: |
            daemon-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.kind }}-${{ hashFiles('daemon/go.sum') }}-
            go-build-${{ runner.os }}-linux-${{ hashFiles('daemon/go.sum') }}-
      - name: Record test identity and cache conditions
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CACHE_HIT: ${{ steps.go-build-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.go-build-cache.outputs.cache-matched-key }}
        run: |
          python3 scripts/daemon-test-shards.py metadata --evidence-dir evidence
          du -sk "$(cd daemon && go env GOCACHE)" "$(cd daemon && go env GOMODCACHE)" >evidence/cache-before.txt
      - name: test (scripts/check.sh)
        env:
          DAEMON_TEST_SHARD_KIND: ${{ matrix.kind }}
          DAEMON_TEST_SHARD_INDEX: ${{ matrix.index }}
          DAEMON_TEST_SHARD_COUNT: ${{ matrix.count }}
          DAEMON_TEST_INTEGRATION_SHARDS: 3
          DAEMON_TEST_EVIDENCE_DIR: ${{ github.workspace }}/evidence
        run: bash scripts/check.sh daemon test
      - name: Record cache size after tests
        if: always()
        run: |
          mkdir -p evidence
          du -sk "$(cd daemon && go env GOCACHE)" "$(cd daemon && go env GOMODCACHE)" >evidence/cache-after.txt
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-linux-${{ matrix.kind }}-${{ matrix.index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
      - name: Save Go build output
        if: github.event_name == 'push' && matrix.index == 1
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.build }}
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

  macos-tests:
    name: macos (test, ${{ matrix.kind }} ${{ matrix.index }}/${{ matrix.count }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: rest, index: 1, count: 1}
          - {kind: integration, index: 1, count: 3}
          - {kind: integration, index: 2, count: 3}
          - {kind: integration, index: 3, count: 3}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: Resolve Go cache paths
        id: go-cache
        working-directory: daemon
        run: |
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
          mkdir -p "$(go env GOCACHE)" "$(go env GOMODCACHE)"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.mod }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('daemon/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - name: Cache Go build output
        id: go-build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.go-cache.outputs.build }}
          # Integration shards share one restore namespace and one main-push
          # writer. Go's content-addressed entries also make the old monolithic
          # cache a safe migration source; no test-result cache is reused.
          key: daemon-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.kind }}-${{ hashFiles('daemon/go.sum') }}-${{ github.sha }}
          restore-keys: |
            daemon-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.kind }}-${{ hashFiles('daemon/go.sum') }}-
            go-build-${{ runner.os }}-macos-${{ hashFiles('daemon/go.sum') }}-
      - name: Record test identity and cache conditions
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CACHE_HIT: ${{ steps.go-build-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.go-build-cache.outputs.cache-matched-key }}
        run: |
          python3 scripts/daemon-test-shards.py metadata --evidence-dir evidence
          du -sk "$(cd daemon && go env GOCACHE)" "$(cd daemon && go env GOMODCACHE)" >evidence/cache-before.txt
      - name: build (scripts/check.sh)
        if: matrix.kind == 'rest'
        run: bash scripts/check.sh daemon build
      - name: test (scripts/check.sh)
        env:
          DAEMON_TEST_SHARD_KIND: ${{ matrix.kind }}
          DAEMON_TEST_SHARD_INDEX: ${{ matrix.index }}
          DAEMON_TEST_SHARD_COUNT: ${{ matrix.count }}
          DAEMON_TEST_INTEGRATION_SHARDS: 3
          DAEMON_TEST_EVIDENCE_DIR: ${{ github.workspace }}/evidence
        run: bash scripts/check.sh daemon test
      - name: Record cache size after tests
        if: always()
        run: |
          mkdir -p evidence
          du -sk "$(cd daemon && go env GOCACHE)" "$(cd daemon && go env GOMODCACHE)" >evidence/cache-after.txt
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-macos-${{ matrix.kind }}-${{ matrix.index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
      - name: Save Go build output
        if: github.event_name == 'push' && matrix.index == 1
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.build }}
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

  linux:
    name: linux (build, test, vet, lint)
    runs-on: ubuntu-latest
    if: always()
    needs: [linux-build, linux-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Require every child to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/daemon-test-shards.py gate --needs "$NEEDS" --expected linux-build linux-tests
      - uses: actions/download-artifact@v4
        with:
          pattern: daemon-linux-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Verify full default coverage
        run: python3 scripts/daemon-test-shards.py verify evidence/*/execution.json

  macos:
    name: macos (build, test)
    runs-on: ubuntu-latest
    if: always()
    needs: [macos-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Require every child to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/daemon-test-shards.py gate --needs "$NEEDS" --expected macos-tests
      - uses: actions/download-artifact@v4
        with:
          pattern: daemon-macos-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Verify full default coverage
        run: python3 scripts/daemon-test-shards.py verify evidence/*/execution.json
