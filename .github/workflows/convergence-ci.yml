name: convergence CI

# The §5.14 real-daemon convergence pass (issue #72): the client halves
# of sync tests 1, 2, 8, 11, and 13-16 against a live
# freeside-signet-dev process (the eight whose daemon halves are
# merged; 5-7, 10, and 12 join with #68's conversations). Part of the
# 1A.0 exit evidence, so it runs in CI rather than as a local-only
# ritual; it spans daemon/ and app/, hence its own workflow with both
# components' paths.
#
# This job also runs FreesideCoreTests, the only place they run in CI
# (#1160). Package.swift declares FreesideCore and its tests only under
# `#if !os(Linux)`, so the ubuntu `package` job never sees them, and on
# macOS SwiftPM links every test target into one bundle: the whole-package
# `swift test` here already compiles FreesideConvergenceTests, so it runs
# FreesideCoreTests at no extra build cost and the convergence suite then
# reuses that bundle with --skip-build. xcodebuild in the `apps` job shares
# no artifacts with SwiftPM (#541), so folding these in there would buy
# nothing.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "daemon/**"
      - "api/openapi.yaml"
      - "scripts/run-convergence.sh"
      - "scripts/check.sh"
      - ".github/workflows/convergence-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "daemon/**"
      - "api/openapi.yaml"
      - "scripts/run-convergence.sh"
      - "scripts/check.sh"
      - ".github/workflows/convergence-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  convergence:
    name: convergence + core tests (real daemon + Swift client)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      # Same two Go caches as daemon-ci.yml, which carries the rationale:
      # modules keyed on go.sum alone, build output on a rolling key so
      # the harness build does not recompile from scratch every run.
      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.mod }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('daemon/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - name: Cache Go build output
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.build }}
          key: go-build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('daemon/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('daemon/go.sum') }}-
            go-build-${{ runner.os }}-${{ github.job }}-
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          # SwiftPM's shared dependency cache: the bare mirrors it clones
          # the pinned checkouts from. macOS location; the Linux one is
          # ~/.cache/org.swift.swiftpm (see app-ci.yml). Not app/.build:
          # caching compiled output could let a stale artifact register
          # as a pass, while a mirror cannot (the pin still decides what
          # is checked out and everything is still compiled here).
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ github.job }}-
      - name: Test Swift package (scripts/check.sh)
        run: bash scripts/check.sh app test
      # The screenshot suite dumps each mismatched render next to its digest
      # line; publishing those PNGs is the only way to review a hosted
      # runner's raster before it is recorded as an override (#1139).
      - name: Resolve screenshot dump directory
        if: failure()
        id: screenshot-dumps
        run: echo "dir=$TMPDIR/freeside-screenshot-regressions" >>"$GITHUB_OUTPUT"
      - name: Upload screenshot mismatch renders
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-mismatches
          path: ${{ steps.screenshot-dumps.outputs.dir }}
          if-no-files-found: ignore
      - name: Run the convergence pass
        env:
          FREESIDE_CONVERGENCE_SKIP_BUILD: "1"
        run: bash scripts/check.sh convergence
