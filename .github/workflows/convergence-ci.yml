name: convergence CI

# The §5.14 real-daemon convergence pass (issue #72): the client halves
# of sync tests 1, 2, 8, 11, and 13-16 against a live
# freeside-signet-dev process (the eight whose daemon halves are
# merged; 5-7, 10, and 12 join with #68's conversations). Part of the
# 1A.0 exit evidence, so it runs in CI rather than as a local-only
# ritual; it spans daemon/ and app/, hence its own workflow with both
# components' paths.
#
# This is also the PR's one macOS Swift job. The org's plan runs at most
# five macOS jobs at once across every workflow, so each macOS job a PR
# requests is queue time for every other run (#2248). When the caller
# selects the app component, the same `swift test` invocation runs every
# Darwin-only suite (FreesideCoreTests, the screenshot regressions) beside
# the convergence suite, and the swift-format gate runs first; the build
# is the same either way. The job runs only through pull-request.yml: a
# push to main carries a tree its PR tested under the up-to-date rule,
# and the Go build cache it restores is saved by daemon-ci.yml's
# `macos-main` job, the SwiftPM mirror by app-ci.yml's `generate` job,
# and the Swift build by app-ci.yml's `swift-build-cache` job.

on:
  workflow_call:
    inputs:
      app_tests:
        description: Run every Swift test suite and the swift-format gate, not only the convergence suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: convergence-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  convergence:
    name: convergence (real daemon + Swift client)
    runs-on: macos-26
    env:
      # Pin the toolchain-bundled swift-format via Xcode selection on the
      # format steps only; a floating tool version would make the
      # formatting gate nondeterministic (same reasoning as the shellcheck
      # and vacuum pins). The test steps keep the image's default Xcode.
      # Bump together with the version documented in app/README.md.
      SWIFT_FORMAT_DEVELOPER_DIR: /Applications/Xcode_26.6.app
      SWIFT_FORMAT_VERSION: 6.3.0
    steps:
      - uses: actions/checkout@v4
      # The Swift build cache key's parts: the OS, the default Xcode build,
      # the toolchain, and app/'s git tree, which covers every file's name,
      # mode, and content (hashFiles hashes contents only, so a rename would
      # keep its key). Not $ImageVersion: GitHub rolls the image about weekly,
      # usually keeping Xcode, and during a rollout runs land on either
      # image, so a third of #2291's warm runs missed on an identical
      # toolchain. app-ci.yml's `swift-build-cache` job carries the same
      # step byte for byte, and the workflow guard pins the two equal, or
      # writer and reader would never share an entry. No DEVELOPER_DIR: the
      # test step builds with the image's default Xcode, not the format pin.
      - name: Resolve the Swift build key
        id: swift-key
        run: |
          toolchain="$(swift --version 2>&1 | grep -o 'swiftlang-[^ )]*' | head -n1)"
          xcode="$(xcodebuild -version | awk '/^Build version/ {print $3}')"
          tree="$(git rev-parse HEAD:app)"
          if [ -z "${ImageOS:-}" ] || [ -z "${xcode}" ] || [ -z "${toolchain}" ] || [ -z "${tree}" ]; then
            echo "swift-key: empty part (ImageOS=${ImageOS:-} xcode=${xcode} toolchain=${toolchain} tree=${tree})" >&2
            exit 1
          fi
          echo "image=${ImageOS}" >>"$GITHUB_OUTPUT"
          echo "xcode=${xcode}" >>"$GITHUB_OUTPUT"
          echo "toolchain=${toolchain}" >>"$GITHUB_OUTPUT"
          echo "tree=${tree}" >>"$GITHUB_OUTPUT"
      - name: Verify pinned swift-format version
        if: inputs.app_tests
        env:
          DEVELOPER_DIR: ${{ env.SWIFT_FORMAT_DEVELOPER_DIR }}
        run: |
          version="$(xcrun swift-format --version)"
          if [ "${version}" != "${SWIFT_FORMAT_VERSION}" ]; then
            echo "swift-format ${version} != pinned ${SWIFT_FORMAT_VERSION}" >&2
            exit 1
          fi
      - name: Lint (scripts/check.sh)
        if: inputs.app_tests
        env:
          DEVELOPER_DIR: ${{ env.SWIFT_FORMAT_DEVELOPER_DIR }}
        run: bash scripts/check.sh app format
      - name: Check formatting drift
        if: inputs.app_tests
        env:
          DEVELOPER_DIR: ${{ env.SWIFT_FORMAT_DEVELOPER_DIR }}
        working-directory: app
        run: |
          files=(Package.swift)
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find Sources Tests Apps -name '*.swift' \
            -not -path 'Sources/FreesideAPI/GeneratedSources/*' -print0)
          xcrun swift-format format --in-place "${files[@]}"
          git diff --exit-code
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: daemon/go.mod
          cache: false
      # Same two Go caches as daemon-ci.yml, which carries the rationale:
      # modules keyed on go.sum alone, build output restored from the
      # daemon's macOS rest namespace, which `macos-main` fills with every
      # compiled package on a push to main, so the harness build does not
      # recompile from scratch. Restore-only: this job never runs on push.
      - name: Resolve Go cache paths
        id: go-cache
        working-directory: daemon
        run: |
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
          mkdir -p "$(go env GOCACHE)" "$(go env GOMODCACHE)"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.mod }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('daemon/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - name: Restore Go build output
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.go-cache.outputs.build }}
          key: daemon-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-rest-${{ hashFiles('daemon/go.sum') }}-${{ github.sha }}
          restore-keys: |
            daemon-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-rest-${{ hashFiles('daemon/go.sum') }}-
            go-build-${{ runner.os }}-${{ github.job }}-${{ hashFiles('daemon/go.sum') }}-
      - name: Restore the SwiftPM mirror
        uses: actions/cache/restore@v4
        with:
          # The bare git mirrors SwiftPM clones the pinned checkouts from,
          # saved by app-ci.yml's `generate` job on a push to main, which
          # carries the rationale for the shared path and key. Restore-only:
          # a save here would be scoped to this PR. It serves every run the
          # Swift build cache below misses, which includes every app PR.
          path: .swiftpm-mirror
          key: swiftpm-mirror-v1-${{ hashFiles('app/Package.resolved') }}
          restore-keys: swiftpm-mirror-v1-
      - name: Link the SwiftPM mirror into SwiftPM's cache
        run: |
          mkdir -p .swiftpm-mirror ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Caches/org.swift.swiftpm/repositories
          ln -s "$PWD/.swiftpm-mirror" ~/Library/Caches/org.swift.swiftpm/repositories
      - name: Restore the Swift build
        id: swift-build
        uses: actions/cache/restore@v4
        with:
          # app/.build with the test bundle, saved by app-ci.yml's
          # `swift-build-cache` job on a push to main (#2291). The key
          # names app/'s git tree, so a hit holds a build of exactly this
          # tree, and a stale artifact cannot register as a pass: any app/
          # change misses. No fallback key: an inexact entry is a partial
          # build SwiftPM must re-scan and partly recompile, which saved
          # under a minute when #2249 measured it.
          path: app/.build
          key: swift-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-key.outputs.image }}-${{ steps.swift-key.outputs.xcode }}-${{ steps.swift-key.outputs.toolchain }}-${{ steps.swift-key.outputs.tree }}
      - name: Run the convergence pass (scripts/check.sh)
        env:
          CONVERGENCE_ALL_TESTS: ${{ inputs.app_tests && '1' || '' }}
          # Skip the Swift build only on an exact hit, and never for an app
          # PR: its --all-tests run must compile the PR's own app changes.
          CONVERGENCE_SKIP_BUILD: ${{ steps.swift-build.outputs.cache-hit == 'true' && !inputs.app_tests && '1' || '' }}
        run: bash scripts/check.sh convergence
      - name: Record the Swift build cache result
        if: always()
        run: |
          echo "cache-hit=${{ steps.swift-build.outputs.cache-hit }}"
          du -sh app/.build 2>/dev/null || echo "app/.build: absent"
      # The screenshot suite dumps each mismatched render next to its digest
      # line; publishing those PNGs is the only way to review a hosted
      # runner's raster before it is recorded as an override (#1139). The
      # matrix's concurrent slices share this directory, and each owns
      # disjoint keys, so no two write the same file (#2292).
      - name: Resolve screenshot dump directory
        if: failure() && inputs.app_tests
        id: screenshot-dumps
        run: echo "dir=$TMPDIR/freeside-screenshot-regressions" >>"$GITHUB_OUTPUT"
      - name: Upload screenshot mismatch renders
        if: failure() && inputs.app_tests
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-mismatches
          path: ${{ steps.screenshot-dumps.outputs.dir }}
          if-no-files-found: ignore
