name: scripts CI

# Gates the repo's maintained development tools: trackercollect's Go module,
# plus bash syntax and shellcheck over every script under scripts/ and
# app/scripts/ and the commit hook (the set scripts/check.sh runs), plus the
# commit-message and merge-result-audit regression suites (isolated synthetic repos, no
# network), the build-image reference regression suite, and the
# check-agent-image regression suite (both use scripted container-runtime
# stand-ins, no network), plus the Mac and iOS installer suites (command
# stand-ins for the build, signing, and device boundaries, no Xcode). A
# macOS job runs the installers' real Foundation URL validator, and the
# Mac installer's exclusive rename path. The retired-vocabulary check
# (scripts/check-vocabulary.sh) also runs here, so the component surfaces it
# covers are triggers too: a change under daemon/, api/, app/, or prompts/
# must schedule the check that guards it.
# The suites test the script implementations only; nothing here parses
# PR prose. Shellcheck runs as a pinned, checksum-verified prebuilt binary,
# matching the pinned-vacuum/golangci-lint determinism convention (a
# floating linter
# is nondeterministic verification).

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "app/scripts/**"
      - ".githooks/**"
      - "app/Apps/iOS/Info.plist"
      - "app/Freeside.xcodeproj/project.pbxproj"
      - ".github/workflows/scripts-ci.yml"
      # Surfaces scripts/check-vocabulary.sh covers.
      - "daemon/**"
      - "api/**"
      - "app/**"
      - "prompts/**"
  pull_request:
    paths:
      - "scripts/**"
      - "app/scripts/**"
      - ".githooks/**"
      - "app/Apps/iOS/Info.plist"
      - "app/Freeside.xcodeproj/project.pbxproj"
      - ".github/workflows/scripts-ci.yml"
      # Surfaces scripts/check-vocabulary.sh covers.
      - "daemon/**"
      - "api/**"
      - "app/**"
      - "prompts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: "0.11.0"
      # sha256 of shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz.
      # Bump together with SHELLCHECK_VERSION.
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check (scripts/check.sh)
        run: bash scripts/check.sh scripts syntax
      - name: Install shellcheck (pinned binary, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
      - name: shellcheck, regression suites, vocabulary (scripts/check.sh)
        # One step per script call: check.sh echoes each command, so a
        # failing suite is still named in the log.
        run: SHELLCHECK=./shellcheck-v${SHELLCHECK_VERSION}/shellcheck bash scripts/check.sh scripts shellcheck suites vocabulary

  trackercollect:
    name: trackercollect (build, test, vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/trackercollect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/trackercollect/go.mod
          cache: false
      - name: build, test, vet (scripts/check.sh)
        working-directory: .
        run: bash scripts/check.sh scripts trackercollect

  mac-installer:
    name: Mac installer real-Swift matrix
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check
        run: bash -n scripts/test-install-mac-app.sh app/scripts/install-mac-app.sh scripts/test-install-ios-app.sh app/scripts/install-ios-app.sh
      - name: Installer matrix with rename stand-in
        run: bash scripts/test-install-mac-app.sh
      - name: Installer matrix with real exclusive rename
        run: FREESIDE_TEST_REAL_RENAME=true bash scripts/test-install-mac-app.sh
      - name: iOS installer suite with the real URL validator
        run: bash scripts/test-install-ios-app.sh
