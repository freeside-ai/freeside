name: credential literals

# Fails when a tracked file carries text the daemon's credential rules match
# (scripts/check-credential-literals.sh). Freeside's agents work on this
# repository, and a credential-shaped fixture they quote can refuse an
# export that leaked nothing (#3305). It runs on every PR, not only when a
# component is selected: a literal can arrive in any file, docs included.

on:
  # Run on every PR through pull-request.yml and report through required.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: credential-literals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Check tracked files for credential-shaped text
        run: bash scripts/check.sh scripts credential-literals
