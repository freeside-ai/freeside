name: commit messages

on:
  # Pull requests run this through pull-request.yml on every change; it
  # reports the required check.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: commit-messages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check exact pull-request commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin "$BASE_SHA" "$HEAD_SHA"
          else
            git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          fi
          bash scripts/check-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"
