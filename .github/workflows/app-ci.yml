name: app CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "api/openapi.yaml"
      - "scripts/test-install-mac-app.sh"
      - "scripts/check.sh"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "api/openapi.yaml"
      - "scripts/test-install-mac-app.sh"
      - "scripts/check.sh"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: style (swift-format)
    runs-on: macos-26
    env:
      # Pin the toolchain-bundled swift-format via Xcode selection; a
      # floating tool version would make the formatting gate
      # nondeterministic (same reasoning as the shellcheck and vacuum
      # pins). Bump together with SWIFT_FORMAT_VERSION and the version
      # documented in app/README.md.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app
      SWIFT_FORMAT_VERSION: 6.3.0
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned swift-format version
        run: |
          version="$(xcrun swift-format --version)"
          if [ "${version}" != "${SWIFT_FORMAT_VERSION}" ]; then
            echo "swift-format ${version} != pinned ${SWIFT_FORMAT_VERSION}" >&2
            exit 1
          fi
      - name: Lint (scripts/check.sh)
        run: bash scripts/check.sh app format
      - name: Check formatting drift
        working-directory: app
        run: |
          xcrun swift-format format --in-place --recursive Sources Tests Apps Package.swift
          git diff --exit-code

  package:
    name: package (schema + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          # SwiftPM's shared dependency cache: the bare mirrors it clones
          # the pinned checkouts from, re-fetched from github.com on
          # every run without this. Linux location here; macOS jobs use
          # ~/Library/Caches/org.swift.swiftpm. Not app/.build: caching
          # compiled output could let a stale artifact register as a
          # pass, while a mirror cannot (Package.resolved still decides
          # what is checked out and everything is still compiled here).
          path: ~/.cache/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ github.job }}-
      - name: Verify generated API client and test the package (scripts/check.sh)
        run: bash scripts/check.sh app generate test

  # The macOS twin of `package`, and the only job that runs
  # FreesideCoreTests: Package.swift declares those targets only under
  # `#if !os(Linux)`, so the ubuntu job never sees them, and `apps`
  # compiles FreesideCore without running a test against it. A separate
  # job rather than an `apps` step, so it runs in parallel and its cost
  # reads as its own duration (#541); SwiftPM shares no build artifacts
  # with xcodebuild, so folding it in would buy nothing. No schema-drift
  # step: `package` runs that, and the result is platform-independent.
  # FreesideConvergenceTests compiles here and skips without its harness
  # environment, so this needs no live daemon.
  core-tests:
    name: core-tests (FreesideCore)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift package (scripts/check.sh)
        run: bash scripts/check.sh app test
      # The screenshot suite dumps each mismatched render next to its digest
      # line; publishing those PNGs is the only way to review a hosted
      # runner's raster before it is recorded as an override (#1139).
      - name: Resolve screenshot dump directory
        if: failure()
        id: screenshot-dumps
        run: echo "dir=$TMPDIR/freeside-screenshot-regressions" >>"$GITHUB_OUTPUT"
      - name: Upload screenshot mismatch renders
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-mismatches
          path: ${{ steps.screenshot-dumps.outputs.dir }}
          if-no-files-found: ignore

  apps:
    name: apps (macOS + iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM dependencies
        # xcodebuild resolves the same twelve packages the package job
        # does, from the same shared cache; see that job for the
        # rationale. Its checkouts land in DerivedData, which stays
        # uncached for the same reason app/.build does.
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ github.job }}-
      - name: Test Mac installer with the real exclusive rename
        run: FREESIDE_TEST_REAL_RENAME=true bash scripts/test-install-mac-app.sh
      - name: Build macOS and iOS apps (scripts/check.sh)
        run: bash scripts/check.sh app build-mac build-ios
