name: app CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "api/openapi.yaml"
      - "scripts/check.sh"
      - ".github/workflows/app-ci.yml"
  # Pull requests run this through pull-request.yml, which selects it
  # from the changed paths and reports the required check. The macOS
  # Swift tests and the swift-format gate run in convergence-ci.yml's one
  # macOS job, which the caller gives `app_tests` whenever it selects this
  # component (#2248). On a push to main the Linux jobs run here, and
  # `swiftpm-cache` refreshes the SwiftPM build cache that job restores.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Only this job compiles the generator toolchain. Consumer builds use the
  # tracked output and can run without waiting for the drift check.
  generate:
    name: generate (API drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ github.job }}-
      - name: Verify generated API client (scripts/check.sh)
        run: bash scripts/check.sh app generate

  # The Linux-clean targets (FreesideAPI, FreesideModel, and their tests)
  # in the official Swift image, which pins the toolchain instead of
  # taking whichever Swift the runner image preinstalls.
  linux:
    name: linux (FreesideModel)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          # SwiftPM's shared dependency cache: the bare mirrors it clones
          # the pinned checkouts from, re-fetched from github.com on
          # every run without this. Linux location here (the container's
          # home); macOS jobs use ~/Library/Caches/org.swift.swiftpm. Not
          # app/.build: caching compiled output could let a stale artifact
          # register as a pass, while a mirror cannot (Package.resolved
          # still decides what is checked out and everything is still
          # compiled here).
          path: ~/.cache/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ github.job }}-
      - name: Build and test the Linux targets (scripts/check.sh)
        run: bash scripts/check.sh app linux

  # PR-only: a push to main carries a tree its PR built under the
  # up-to-date rule, and this build warms no cache a PR restores.
  apps:
    name: apps (macOS + iOS)
    runs-on: macos-26
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM dependencies
        # xcodebuild resolves app/Package.swift's graph, pruned to the
        # packages the app targets consume, from SwiftPM's shared
        # dependency cache; see the linux job for the rationale. Its
        # checkouts land in DerivedData, which stays uncached for the
        # same reason app/.build does.
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ github.job }}-
      - name: Build macOS and iOS apps (scripts/check.sh)
        run: bash scripts/check.sh app build-mac build-ios

  # Push-only: saves the app/.build entry convergence-ci.yml's
  # `convergence` job restores, since a PR run's save is scoped to that
  # PR and only a push to main fills an entry every PR can read. When the
  # entry exists the job is a checkout and a cache lookup (under a
  # minute); when the key changes (Package.resolved, the image, or its
  # default toolchain) it builds the test graph once, against the 2 to 3
  # minutes each app PR saves (#2249). A quick second app-path merge may
  # cancel it under `cancel-in-progress`; the next app-path push repairs
  # the miss.
  swiftpm-cache:
    name: swiftpm build cache (main)
    runs-on: macos-26
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      # The key's twin is the same step in convergence-ci.yml's
      # `convergence` job, which restores the entry this job saves;
      # change both together or the keys stop matching.
      - name: Resolve SwiftPM build cache key
        id: swiftpm-key
        run: |
          toolchain="$(swift --version 2>&1 | grep -o 'swiftlang-[0-9.]*' | head -n 1)"
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ] || [ -z "${toolchain}" ]; then
            echo "cannot resolve image (${ImageOS:-}-${ImageVersion:-}) or toolchain (${toolchain})" >&2
            exit 1
          fi
          echo "image=${ImageOS}-${ImageVersion}" >>"$GITHUB_OUTPUT"
          echo "toolchain=${toolchain}" >>"$GITHUB_OUTPUT"
      - name: Look up SwiftPM build output
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: app/.build
          key: swiftpm-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swiftpm-key.outputs.image }}-${{ steps.swiftpm-key.outputs.toolchain }}-${{ hashFiles('app/Package.resolved') }}
          lookup-only: true
      # The graph the convergence job's test run compiles: debug, test
      # targets included, the image's default Xcode.
      - name: Build the Swift test graph
        if: steps.lookup.outputs.cache-hit != 'true'
        working-directory: app
        run: swift build --only-use-versions-from-resolved-file --build-tests
      - name: Report SwiftPM build output size
        if: steps.lookup.outputs.cache-hit != 'true'
        run: du -sh app/.build
      - name: Save SwiftPM build output
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/.build
          key: ${{ steps.lookup.outputs.cache-primary-key }}
