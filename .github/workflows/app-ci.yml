name: app CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "api/openapi.yaml"
      - "scripts/check.sh"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "api/openapi.yaml"
      - "scripts/check.sh"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: style (swift-format)
    runs-on: macos-26
    env:
      # Pin the toolchain-bundled swift-format via Xcode selection; a
      # floating tool version would make the formatting gate
      # nondeterministic (same reasoning as the shellcheck and vacuum
      # pins). Bump together with SWIFT_FORMAT_VERSION and the version
      # documented in app/README.md.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app
      SWIFT_FORMAT_VERSION: 6.3.0
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned swift-format version
        run: |
          version="$(xcrun swift-format --version)"
          if [ "${version}" != "${SWIFT_FORMAT_VERSION}" ]; then
            echo "swift-format ${version} != pinned ${SWIFT_FORMAT_VERSION}" >&2
            exit 1
          fi
      - name: Lint (scripts/check.sh)
        run: bash scripts/check.sh app format
      - name: Check formatting drift
        working-directory: app
        run: |
          files=(Package.swift)
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find Sources Tests Apps -name '*.swift' \
            -not -path 'Sources/FreesideAPI/GeneratedSources/*' -print0)
          xcrun swift-format format --in-place "${files[@]}"
          git diff --exit-code

  # Only this job compiles the generator toolchain. Consumer builds use the
  # tracked output and can run without waiting for the drift check.
  generate:
    name: generate (API drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ github.job }}-
      - name: Verify generated API client (scripts/check.sh)
        run: bash scripts/check.sh app generate

  package:
    name: package (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          # SwiftPM's shared dependency cache: the bare mirrors it clones
          # the pinned checkouts from, re-fetched from github.com on
          # every run without this. Linux location here; macOS jobs use
          # ~/Library/Caches/org.swift.swiftpm. Not app/.build: caching
          # compiled output could let a stale artifact register as a
          # pass, while a mirror cannot (Package.resolved still decides
          # what is checked out and everything is still compiled here).
          path: ~/.cache/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ github.job }}-
      - name: Test Swift package (scripts/check.sh)
        run: bash scripts/check.sh app test

  apps:
    name: apps (macOS + iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM dependencies
        # xcodebuild resolves the same twelve packages the package job
        # does, from the same shared cache; see that job for the
        # rationale. Its checkouts land in DerivedData, which stays
        # uncached for the same reason app/.build does.
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ github.job }}-
      - name: Build macOS and iOS apps (scripts/check.sh)
        run: bash scripts/check.sh app build-mac build-ios
