name: Work unit
description: A claimable unit of implementation work
body:
  - type: input
    id: source_devlog
    attributes:
      label: Source devlog entry
      description: >
        Only when this issue originated in a decision note, cite the
        note's repo-relative filename; leave blank otherwise.
      placeholder: devlog/YYYY-MM-DD-HHMM-slug.md
    validations:
      required: false
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: >
        The outcome this unit delivers and why: the problem or need, and
        the state of the world when the unit is done.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: >
        Explicit exclusions: adjacent work this unit deliberately does not
        do, so scope disputes resolve from the record. Write "none" if
        there are none.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Affected interfaces/contracts
      description: >
        Interfaces, domain types, schemas, or API surfaces this unit
        touches (not the whole work contract; the issue as a whole is
        that). If it CHANGES any shared contract, stop: file it as
        kind:contract instead; contract units are exclusive and
        spine-owned.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: >
        The test and fixture list that defines done. Prefer enumerable
        fixtures (importer cases, sync tests, conformance checks) over prose.
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Scope / declared paths
      description: >
        Directories this unit may modify (scope-discipline convention).
        Work outside these paths belongs to another unit.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: >
        Type every relationship as starts-after (the prerequisite PR must merge
        before this unit starts), merges-after (this unit may start, but its PR
        integrates later), stacked-on (name the open PR branch used as the
        base), or exclusive-with (the units may not be active concurrently; a
        declaration on either unit applies symmetrically). Write "none" if
        none; ambiguous relationships serialize as starts-after until the spine
        resolves them.
    validations:
      required: true
