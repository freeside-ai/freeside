# Curated for deterministic, agent-friendly signal, not minimal and not
# opinion-heavy: lint is the cheapest reviewer, so every deterministic
# finding caught here is a review round not spent. Strictness is close to
# free now (near-zero code) and expensive to add later (cross-lane churn),
# while loosening is a one-line change; so we start strict and select for
# determinism over opinion.
#
# This file is a §5.6 verification-control surface: weakening it is a
# small, visible, gated change with a devlog rationale, never a silent
# batch into a feature PR.
version: "2"

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - depguard # test-only store fixtures stay out of production files
    - errorlint # error-wrapping mistakes (%w vs %v, errors.Is/As misuse)
    - exhaustive # missing enum switch cases (matters once domain lands)
    - forbidigo # production store opens go through the topic-key helper
    - gosec # security static checks for a credential-broker daemon
    - misspell # free, deterministic spelling fixes in comments/strings
    - nolintlint # keep //nolint directives specific and explained
    - paralleltest # top-level tests run in parallel unless they say why not
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    exhaustive:
      default-signifies-exhaustive: true
    # Only top-level tests are checked: their serial phase sets a package's
    # wall time, while a serial subtest table inside a parallel test does
    # not. tparallel stays off because it flags only mixed use, never a
    # fully serial test. devlog/2026-11-05-2003-parallel-test-lint.md
    paralleltest:
      ignore-missing-subtests: true
    # A production store open has to load or create the topic key first
    # (cmd/freesided/topic_key.go), so store.Open is forbidden outside the
    # files listed under exclusions. analyze-types matches the
    # package, not the identifier, so an alias or a local variable named
    # store is judged by what it is.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^store\.Open$
          pkg: ^github\.com/freeside-ai/freeside/daemon/internal/store$
          msg: open a production store through openStoreWithTopicKey
    depguard:
      rules:
        storetest:
          files:
            - "!$test"
          deny:
            - pkg: github.com/freeside-ai/freeside/daemon/internal/store/storetest
              desc: storetest opens stores without a topic key; tests only
  exclusions:
    rules:
      # The development signet, shared test support (which depguard keeps
      # out of production files), and the topic store open a store directly,
      # and so does the store package itself, where Open is unqualified.
      - path: (^cmd/freeside-signet-dev/main\.go|^internal/store/storetest/storetest\.go|^internal/topicstore/topicstore\.go|^internal/store/[^/]+\.go|_test\.go)$
        linters:
          - forbidigo
      # Packages whose top-level tests still lack t.Parallel(). This list
      # only shrinks: deleting a package turns the paralleltest ratchet on
      # for it, and a new package is never added. A test that must stay
      # serial carries `//nolint:paralleltest // Serial: <reason>` on the
      # line above its func; a test that calls t.Setenv is not flagged.
      # Each line ends in an escaped line break, so YAML joins the lines
      # with nothing between them.
      - path: "^(?:\
          cmd/freeside-export\
          |cmd/freeside-image-build\
          |cmd/freeside-project-image\
          |cmd/freeside-signet-dev\
          |cmd/freesided\
          |internal/advisory\
          |internal/agentbaseline\
          |internal/agenttree\
          |internal/atomicfile\
          |internal/claudeinference\
          |internal/contentaddr\
          |internal/daemonlock\
          |internal/diffscope\
          |internal/doclayout\
          |internal/domain\
          |internal/engine\
          |internal/exec\
          |internal/exec/claude\
          |internal/exec/fake\
          |internal/exec/stage\
          |internal/export\
          |internal/fakepublication\
          |internal/gitrun\
          |internal/golden\
          |internal/importer\
          |internal/inference\
          |internal/inference/fake\
          |internal/intake\
          |internal/integration\
          |internal/observe\
          |internal/observe/comprehension\
          |internal/observe/observedb\
          |internal/operations\
          |internal/pathfold\
          |internal/procbound\
          |internal/projectimage\
          |internal/publicationtext\
          |internal/publish\
          |internal/repotemplate\
          |internal/scheduler\
          |internal/seedfixture\
          |internal/signet\
          |internal/specify\
          |internal/specify/fake\
          |internal/store\
          |internal/strictjson\
          |internal/topicstore\
          |internal/verify\
          |internal/ward\
          |internal/wardstore\
          )/[^/]+_test[.]go$"
        linters:
          - paralleltest

formatters:
  # Deterministic formatting as law removes an entire class of review
  # noise; gofumpt is a strict superset of gofmt.
  enable:
    - gofumpt
